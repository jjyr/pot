name: macOS release and authenticated updates

# Only CI can enter after shared checks and this channel's packaging gates.
on:
  workflow_call:
    outputs:
      macos-mode:
        description: Mode selected before sealing the published macOS packages
        value: ${{ jobs.preflight.outputs.mode }}
    inputs:
      sha:
        required: true
        type: string
      version:
        required: true
        type: string
      public-key:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pot-macos-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify macOS mode and release configuration
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.preflight.outputs.mode }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.10.10
          cache: false
          install_args: go python
      - name: Verify selected mode, required credentials and update key pair
        id: preflight
        env:
          POT_MACOS_RELEASE_MODE: ${{ vars.POT_MACOS_RELEASE_MODE }}
          POT_UPDATE_PUBLIC_KEY: ${{ inputs.public-key }}
          POT_UPDATE_PRIVATE_KEY: ${{ secrets.POT_UPDATE_PRIVATE_KEY }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: mise exec -- python scripts/release-preflight

  macos:
    needs: preflight
    name: Seal macOS packages (${{ needs.preflight.outputs.mode }})
    runs-on: macos-26
    environment: release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-cli-linux-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-macos
          path: dist
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.10.10
          cache: false
          install_args: python
      - name: Seal validated archives in selected mode
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: mise exec -- python scripts/sign-macos-release '${{ inputs.version }}' dist --mode '${{ needs.preflight.outputs.mode }}'
      - name: Smoke final macOS packages
        env:
          POT_APP_VERSION: ${{ inputs.version }}
          POT_BUILD_REVISION: ${{ inputs.sha }}
          POT_MACOS_RELEASE_MODE: ${{ needs.preflight.outputs.mode }}
        run: |
          mise exec -- python scripts/tests/macos-package-smoke.py dist/Pot-${{ inputs.version }}-arm64.zip
          mise exec -- python scripts/tests/server-package-smoke.py dist/pot-${{ inputs.version }}-darwin-arm64.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sealed-macos
          path: |
            dist/Pot-*.zip
            dist/Pot-*.zip.sha256
            dist/pot-*-darwin-arm64.tar.gz
            dist/pot-*-darwin-arm64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [preflight, macos]
    name: Publish macOS assets and authenticated update feed
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: pot-github-assets-${{ inputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.10.10
          cache: false
          install_args: go python
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-cli-linux-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-macos
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sealed-macos
          merge-multiple: true
          path: dist
      - name: Generate signed feed, cask and final checksums
        env:
          POT_BUILD_REVISION: ${{ inputs.sha }}
          POT_UPDATE_PUBLIC_KEY: ${{ inputs.public-key }}
          POT_UPDATE_PRIVATE_KEY: ${{ secrets.POT_UPDATE_PRIVATE_KEY }}
        run: mise exec -- python scripts/prepare-release '${{ inputs.version }}' dist --channel macos --sign-feed --macos-mode '${{ needs.preflight.outputs.mode }}'
      - name: Publish qualified macOS channel assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: mise exec -- python scripts/publish-release '${{ inputs.version }}' dist --channel macos --macos-mode '${{ needs.preflight.outputs.mode }}'

  homebrew:
    needs: publish
    name: Propose Homebrew packages after publication
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Verify published bytes and propose Homebrew PR
        id: sync
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: python3 scripts/sync-homebrew "$RELEASE_VERSION" "$RELEASE_SHA"
      - name: Report Homebrew synchronization separately from publication
        if: always()
        env:
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          if [ "$SYNC_OUTCOME" = success ]; then
            echo "macOS assets published. Homebrew packages verified; see sync log for PR or already synchronized status. Review/merge any pending Homebrew PR before installation or upgrades." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::macOS assets are published, but Homebrew synchronization failed. Inspect the sync log and repository Actions PR permissions."
            echo "macOS publication succeeded; Homebrew sync needs attention. No automatic retry or main push was attempted." >> "$GITHUB_STEP_SUMMARY"
            echo "After resolving permissions or reviewing the existing branch/PR, run: GITHUB_REPOSITORY=jjyr/pot python3 scripts/sync-homebrew $RELEASE_VERSION $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
          fi
