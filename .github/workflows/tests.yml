name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Resolved source SHA for release/build callers
        type: string
        required: true
      use-cache:
        description: Explicit source/PR validation may not use shared caches
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: tests-${{ (github.event_name == 'workflow_dispatch' || inputs.ref != '') && 'full' || 'light' }}-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref }}
  # A release caller must not be cancelled by another validation run.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && inputs.ref == '' }}

env:
  MISE_AUTO_INSTALL: 'false'
  POT_TEST_TIMEOUT_SCALE: '4'

jobs:
  lightweight:
    name: Lightweight checks (Linux)
    if: github.event_name != 'workflow_dispatch' && inputs.ref == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/test-setup
        with:
          scope: core
          tools: go python node ruff shfmt shellcheck swiftformat
      - name: Core, static, translation, UI and packaging contracts
        run: mise run ci:light
      - name: Validate all workflow interfaces
        run: mise exec -- go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11

  product:
    name: Full product / ${{ matrix.plan.name }} (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' || inputs.ref != ''
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
        plan:
          - {name: Normal and static checks, mode: normal, shard: '1/1'}
          - {name: Race 1/4, mode: race, shard: '1/4'}
          - {name: Race 2/4, mode: race, shard: '2/4'}
          - {name: Race 3/4, mode: race, shard: '3/4'}
          - {name: Race 4/4, mode: race, shard: '4/4'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/test-setup
        with:
          scope: ${{ matrix.plan.mode }}
          tools: ${{ matrix.plan.mode == 'normal' && 'go python node ruff shfmt shellcheck swiftformat' || 'go python node' }}
          cache: ${{ inputs.ref == '' || inputs.use-cache }}
      - name: Normal tests, static checks and contracts in parallel
        if: matrix.plan.mode == 'normal'
        run: mise run ci:normal
      - name: Complete race coverage for this shard
        if: matrix.plan.mode == 'race'
        run: mise exec -- python scripts/test_go.py race --shard ${{ matrix.plan.shard }} --count=1
      - if: matrix.plan.mode == 'normal' && runner.os == 'Linux'
        run: mise exec -- go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11

  sandbox:
    name: Real sandbox (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' || inputs.ref != ''
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/test-setup
        with:
          scope: race
          tools: go python node
          cache: ${{ inputs.ref == '' || inputs.use-cache }}
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap ripgrep socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Qualify real sandbox isolation and cleanup
        run: mise run test:sandbox

  macos-lifecycle:
    name: Process lifecycle (macOS)
    if: github.event_name != 'workflow_dispatch' && inputs.ref == ''
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/test-setup
        with:
          scope: race
          tools: go node
      - name: Check cancellation, idle expiry and process cleanup
        run: mise exec -- go test -race -count=1 -timeout=5m ./pkg/processscope ./pkg/executor -run '^(TestDarwinCancellation.*|TestTimeoutIdleCancellationAndNoDescendants|TestSupervisorReadinessPrecedesImmediateCancellation|TestSupervisorCancellationBeforeReadinessDoesNotLaunch|TestDetachedDescendantIsStoppedBeforeReceipt)$'
