name: Sandbox resources
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Resource tag already committed in the embedded catalog
        required: true
        default: sandbox-go-resources-v0.2.0
        type: string
      prepared_assets:
        description: Absolute directory of reviewed exported assets on the release runner
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: pot-sandbox-resources
  cancel-in-progress: false
jobs:
  resources:
    runs-on: [self-hosted, macOS, ARM64, pot-release]
    timeout-minutes: 120
    env:
      RESOURCE_TAG: ${{ inputs.tag }}
      PREPARED_ASSETS: ${{ inputs.prepared_assets }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.10.10
      - name: Verify and stage reviewed resource assets
        run: |
          staged=$(mktemp -d "$RUNNER_TEMP/pot-sandbox-resources.XXXXXX")
          rmdir "$staged"
          manifest=$(mktemp "$RUNNER_TEMP/pot-sandbox-resources-manifest.XXXXXX")
          mise exec -- python scripts/verify-go-sandbox-resources \
            --source "$PREPARED_ASSETS" --tag "$RESOURCE_TAG" --output "$staged" >"$manifest"
          echo "RESOURCE_MANIFEST=$manifest" >>"$GITHUB_ENV"
      - name: Publish immutable resources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mise exec -- python - <<'PYTHON'
          import json, os, pathlib, subprocess
          manifest = json.loads(pathlib.Path(os.environ["RESOURCE_MANIFEST"]).read_text())
          tag = os.environ["RESOURCE_TAG"]
          if manifest["tag"] != tag or not manifest["files"]:
              raise ValueError("Verified resource manifest does not match this release")
          # Upload only the exact verified files, never other source/staging files.
          subprocess.run([
              "gh", "release", "create", tag, "--repo", os.environ["GITHUB_REPOSITORY"],
              "--target", os.environ["GITHUB_SHA"], "--draft", "--latest=false",
              "--title", tag, "--notes", "SHA-256 pinned Linux Sandbox resources.",
              *manifest["files"],
          ], check=True)
          subprocess.run([
              "gh", "release", "edit", tag, "--repo", os.environ["GITHUB_REPOSITORY"],
              "--draft=false", "--latest=false",
          ], check=True)
          PYTHON
