name: Verify public release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      source:
        required: true
        type: string
      public-key:
        required: true
        type: string
      macos-mode:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Stable release version (without v)
        required: true
        type: string
      source:
        description: Trusted expected full source commit SHA
        required: true
        type: string
      macos-mode:
        description: Expected release signing mode
        required: true
        type: choice
        options: [unsigned, signed]
      phase:
        description: Publication bytes or installation including merged Homebrew pointers
        type: choice
        default: installation
        options: [publication, installation]

permissions:
  contents: read

jobs:
  verify:
    name: Verify anonymous public bytes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Use verifier code at the selected workflow revision. Expected release
      # source remains an explicit independent input, including historical checks.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.10.10
          cache: false
          install_args: go python
      - name: Verify all public channels with the shared entry point
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SOURCE: ${{ inputs.source }}
          POT_UPDATE_PUBLIC_KEY: ${{ inputs.public-key || vars.POT_UPDATE_PUBLIC_KEY }}
          RELEASE_MACOS_MODE: ${{ inputs.macos-mode }}
          RELEASE_PHASE: ${{ inputs.phase || 'publication' }}
        run: >-
          mise exec -- python scripts/verify-release "$RELEASE_VERSION" "$RELEASE_SOURCE"
          --macos-mode "$RELEASE_MACOS_MODE" --phase "$RELEASE_PHASE"
          --output verification --markdown
      - name: Retain verification evidence even after failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-verification
          path: verification/
          if-no-files-found: error
          retention-days: 7
      - name: Show verification summary
        if: always()
        run: |
          if [ -f verification/report.md ]; then
            cat verification/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
