name: GHCR release channel

on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pot-container-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified OCI image to GHCR
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      POT_BUILD_REVISION: ${{ inputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-container
          path: dist
      - name: Verify image checksum, actual architectures, version and source revision
        run: python3 scripts/prepare-release '${{ inputs.version }}' dist --channel container
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Copy the verified index and both architectures to its version tag
        run: python3 scripts/publish-container '${{ inputs.version }}' dist
