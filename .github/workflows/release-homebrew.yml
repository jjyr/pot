name: Release Homebrew

run-name: release-homebrew [${{ inputs.request-id || github.event.workflow_run.id }}] version=${{ inputs.version || 'from-publication' }}

on:
  workflow_run:
    workflows: [Release publish]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Published stable version
        required: true
        type: string
      revision:
        description: Full source SHA bound to the published tag
        required: true
        type: string
      request-id:
        description: Opaque request identifier used for correlation
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-homebrew
  cancel-in-progress: false

jobs:
  homebrew:
    name: Verify published bytes and propose Homebrew PR
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Require trusted default-branch invocation
        env:
          EVENT: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" != "branch" ] || [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::error::Homebrew recovery must run on the default branch"
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify publication and propose packages
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PUBLISH_RUN_ID: ${{ github.event.workflow_run.id }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.revision }}
        run: |
          if [ "$EVENT" = "workflow_run" ]; then
            python3 scripts/sync-homebrew --publish-run-id "$PUBLISH_RUN_ID"
          else
            python3 scripts/sync-homebrew "$RELEASE_VERSION" "$RELEASE_SHA"
          fi
      - name: Report proposal result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          echo "Homebrew proposal: $RESULT. GitHub/GHCR publication is independent. Proposal success does not confirm PR merge." >> "$GITHUB_STEP_SUMMARY"
          echo "If PR creation is disabled, review the generated branch and open its PR with a maintainer account. Otherwise rerun this workflow with the published version and source SHA." >> "$GITHUB_STEP_SUMMARY"
