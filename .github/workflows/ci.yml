name: CI

on:
  push:
    tags: ["v*.*.*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Install only each job's explicit tool subset; mise run/exec otherwise installs
# every tool in mise.toml, including the unrelated cargo-zigbuild source build.
env:
  MISE_AUTO_INSTALL: 'false'
  CARGO_INCREMENTAL: '0'

jobs:
  licenses:
    name: Rust dependency licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.10.10
          install_args: rust mr-boxington python github:EmbarkStudios/cargo-about
      - name: Restore license sources
        id: license-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: license-sources-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: license-sources-v1-${{ runner.os }}-
      - run: mise run licenses
      - run: mise run test:licenses

  backend:
    name: Linux backend and deterministic eval
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.10.10
          install_args: rust mr-boxington python conda:brotli-bin
      - run: mise exec -- rustup component add clippy
      - name: Identify Rust compiler
        id: rust-version
        run: echo "hash=$(mise exec -- rustc -vV | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .local/poc/cargo-target
          key: rust-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-version.outputs.hash }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-version.outputs.hash }}-${{ hashFiles('Cargo.lock') }}-
            rust-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-version.outputs.hash }}-
      - run: mise run test:web-assets
      - run: mise run clippy:backend
      - run: mise run test
      - run: mise run test:ui
      - run: mise run test:executor
      - run: mise run test:skills
      - run: mise run test:eval

  macos:
    name: macOS formatting, App and Swift Helper
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.10.10
          install_args: rust mr-boxington python conda:brotli-bin ruff shfmt shellcheck swiftformat
      - name: Check platform prerequisites
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version
          mise exec -- rustup component add rustfmt clippy
      - name: Identify Rust compiler
        id: rust-version
        run: echo "hash=$(mise exec -- rustc -vV | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .local/poc/cargo-target
          key: rust-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-version.outputs.hash }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-version.outputs.hash }}-${{ hashFiles('Cargo.lock') }}-
            rust-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-version.outputs.hash }}-
      - name: Identify Xcode toolchain
        id: xcode-version
        run: echo "hash=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore Swift build cache
        id: swift-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .local/d1/helper-build
            .local/d1/swift-modules
            .local/d1/clang-modules
          key: swift-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-version.outputs.hash }}-${{ hashFiles('helper/Package.resolved', 'helper/Package.swift') }}-${{ github.sha }}
          restore-keys: |
            swift-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-version.outputs.hash }}-${{ hashFiles('helper/Package.resolved', 'helper/Package.swift') }}-
            swift-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-version.outputs.hash }}-
      - run: mise run check
      - run: mise run clippy
      - run: mise run test
      - run: mise run test:ui
      - run: mise run test:app
      - run: mise run test:release
      - run: mise run test:executor
      - run: mise run test:skills
      - run: mise run test:skill-authoring
