name: CI
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact reviewed fixture source SHA; never publishes
        required: true
        type: string
permissions:
  contents: read
env:
  MISE_AUTO_INSTALL: 'false'
  POT_TEST_TIMEOUT_SCALE: '4'
jobs:
  native-fixtures:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Require the exact reviewed source
        env:
          SOURCE: ${{ inputs.ref }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE"
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.10.10
          cache: false
          install_args: go python node
      - name: Verify detached descendant readiness and deadline diagnostics
        run: mise exec -- go test -v -failfast -count=3 ./pkg/pluginhost -run '^TestBackgroundCancellationUsesSupervisorForDetachedDescendants$'
      - name: Verify detached descendant cancellation under race
        run: mise exec -- go test -v -race -failfast -count=5 ./pkg/pluginhost -run '^TestBackgroundCancellationUsesSupervisorForDetachedDescendants$'
