name: CI

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      version:
        required: true
        type: string
      public-key:
        description: Pinned public update key for release preparation
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Source ref (blank uses selected branch/tag; validation never publishes)
        required: false
        type: string
      pr:
        description: PR number to check (mutually exclusive with ref)
        required: false
        type: string
      validation-version:
        description: Optional package version for a nonpublishing candidate (major.minor.patch)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref }}-pr-${{ inputs.pr || 'none' }}
  cancel-in-progress: false

env:
  MISE_AUTO_INSTALL: 'false'

jobs:
  source:
    name: Resolve validation source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      public-key: ${{ inputs.public-key || vars.POT_UPDATE_PUBLIC_KEY }}
    steps:
      # Resolve using the selected workflow's code before executing any PR code.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Resolve selected ref or PR head
        id: source
        env:
          SOURCE_REF: ${{ inputs.ref }}
          PR_NUMBER: ${{ inputs.pr }}
          VALIDATION_VERSION: ${{ inputs.version || inputs.validation-version }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-plan

  product:
    needs: source
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ needs.source.outputs.sha }}
      use-cache: ${{ inputs.pr == '' && inputs.ref == '' }}

  build-checks:
    needs: [source, product]
    name: Headless build checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/test-setup
        with:
          scope: builds
          cache: ${{ inputs.pr == '' && inputs.ref == '' }}
      - run: mise run build:go
      - run: mise run build:linux

  server:
    needs: [source, product, build-checks]
    name: Native CLI (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux-amd64}
          - {os: ubuntu-24.04-arm, platform: linux-arm64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      POT_APP_VERSION: ${{ needs.source.outputs.version }}
      POT_BUILD_REVISION: ${{ needs.source.outputs.sha }}
      POT_UPDATE_PUBLIC_KEY: ${{ needs.source.outputs.public-key }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.10.10
          cache: false
          install_args: go python node
      - run: mise exec -- python scripts/package-server --platform ${{ matrix.platform }} --output dist
      - run: mise exec -- python scripts/tests/server-package-smoke.py dist/pot-${{ env.POT_APP_VERSION }}-${{ matrix.platform }}.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-cli-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  macos:
    needs: [source, product, build-checks]
    name: Native macOS App
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # Validation always exercises ad-hoc sealing without release credentials.
      POT_MACOS_RELEASE_MODE: unsigned
      POT_APP_VERSION: ${{ needs.source.outputs.version }}
      POT_BUILD_REVISION: ${{ needs.source.outputs.sha }}
      POT_UPDATE_PUBLIC_KEY: ${{ needs.source.outputs.public-key }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.10.10
          cache: false
          install_args: go python node
      - run: mise exec -- python scripts/release "$POT_APP_VERSION" --app-only --output dist
      - run: mise exec -- python scripts/package-server --platform darwin-arm64 --output dist
      - name: Exercise unsigned sealing before native smoke
        run: |
          mise exec -- python scripts/sign-macos-release "$POT_APP_VERSION" dist --mode unsigned
          mise exec -- python scripts/generate-cask "$POT_APP_VERSION" dist
          mise exec -- python scripts/generate-formula "$POT_APP_VERSION" dist
      - run: mise exec -- python scripts/tests/server-package-smoke.py dist/pot-${{ env.POT_APP_VERSION }}-darwin-arm64.tar.gz
      - run: ruby -c dist/pot.rb
      - run: ruby -c dist/pot-cli.rb
      - run: brew ruby scripts/tests/homebrew-cask.rb Casks/pot.rb dist/pot.rb
      - run: brew ruby scripts/tests/homebrew-formula.rb Formula/pot-cli.rb dist/pot-cli.rb
      - run: mise exec -- python scripts/tests/macos-package-smoke.py dist/Pot-${{ env.POT_APP_VERSION }}-arm64.zip
      - name: Simulate native App upgrade and launch-failure rollback
        run: mise run test:macos-update
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-macos
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  desktop:
    needs: [source, product, build-checks]
    name: Experimental Linux desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      POT_APP_VERSION: ${{ needs.source.outputs.version }}
      POT_BUILD_REVISION: ${{ needs.source.outputs.sha }}
      POT_UPDATE_PUBLIC_KEY: ${{ needs.source.outputs.public-key }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.10.10
          cache: false
          install_args: go python node
      - run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config binutils xvfb xauth dbus-user-session bubblewrap socat
      - run: mise exec -- python scripts/build-desktop --platform linux-amd64 --output dist
      - run: xvfb-run -a mise exec -- python scripts/smoke-desktop --archive "dist/pot-desktop_${POT_APP_VERSION}_linux_amd64.deb" --platform linux-amd64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-desktop-linux-amd64
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  docker-smoke:
    needs: [source, product, build-checks]
    name: Native container smoke (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, arch: amd64}
          - {os: ubuntu-24.04-arm, arch: arm64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      POT_APP_VERSION: ${{ needs.source.outputs.version }}
      POT_BUILD_REVISION: ${{ needs.source.outputs.sha }}
      POT_UPDATE_PUBLIC_KEY: ${{ needs.source.outputs.public-key }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build native image without pushing
        run: |
          docker buildx build --platform linux/${{ matrix.arch }} --load -t pot:smoke \
            --build-arg POT_APP_VERSION --build-arg POT_BUILD_REVISION --build-arg POT_UPDATE_PUBLIC_KEY .
      - name: Verify container version and revision
        run: |
          package_version=$(docker run --rm pot:smoke --version)
          test "$package_version" = "pot $POT_APP_VERSION ($POT_BUILD_REVISION)"
      - run: python3 scripts/tests/docker-smoke.py --image pot:smoke --sandbox unavailable

  container:
    needs: [source, docker-smoke]
    name: Multiarchitecture OCI distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      POT_APP_VERSION: ${{ needs.source.outputs.version }}
      POT_BUILD_REVISION: ${{ needs.source.outputs.sha }}
      POT_UPDATE_PUBLIC_KEY: ${{ needs.source.outputs.public-key }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Export multiarchitecture image without pushing
        run: |
          mkdir -p dist
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg POT_APP_VERSION --build-arg POT_BUILD_REVISION --build-arg POT_UPDATE_PUBLIC_KEY \
            --output "type=oci,dest=dist/pot-container-${POT_APP_VERSION}.oci.tar" .
          sha256sum "dist/pot-container-${POT_APP_VERSION}.oci.tar" > "dist/pot-container-${POT_APP_VERSION}.oci.tar.sha256"
          sed -i 's@  dist/@  @' "dist/pot-container-${POT_APP_VERSION}.oci.tar.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-container
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  distribution:
    needs: [source, server, macos, desktop, container]
    name: Verify complete distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - env:
          POT_BUILD_REVISION: ${{ needs.source.outputs.sha }}
        run: python3 scripts/prepare-release '${{ needs.source.outputs.version }}' dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distribution-unsigned
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          overwrite: true
