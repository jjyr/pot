name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Linux backend and deterministic eval
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.6.0
          install_args: rust
      - run: mise exec -- rustup component add clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .local/poc/cargo-target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'Cargo.lock') }}-
      - run: mise run clippy:backend
      - run: mise run test
      - run: mise run test:eval

  macos:
    name: macOS formatting, App and Swift Helper
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.6.0
          install_args: rust python ruff shfmt shellcheck swiftformat
      - name: Check platform prerequisites
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version
          mise exec -- rustup component add rustfmt clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .local/poc/cargo-target
            .local/d1/helper-build
            .local/d1/swift-modules
            .local/d1/clang-modules
          key: build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'Cargo.lock', 'helper/Package.resolved', 'helper/Package.swift') }}-${{ github.sha }}
          restore-keys: |
            build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'Cargo.lock', 'helper/Package.resolved', 'helper/Package.swift') }}-
      - run: mise run check
      - run: mise run clippy
      - run: mise run test
      - run: mise run test:app
      - run: mise run test:skills
      - run: mise run test:skill-authoring
