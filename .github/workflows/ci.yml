name: CI
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact reviewed fixture source SHA; never publishes
        required: true
        type: string
permissions:
  contents: read
env:
  MISE_AUTO_INSTALL: 'false'
  POT_TEST_TIMEOUT_SCALE: '4'
jobs:
  native-fixtures:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Require the exact reviewed source
        env:
          SOURCE: ${{ inputs.ref }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE"
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.10.10
          cache: false
          install_args: go python node
      - name: Prepare the pinned real sandbox SDK
        run: |
          mise exec -- python - <<'PYTHON'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from pot_packaging import prepare_sandbox
          prepare_sandbox(Path('.local/pot/sandbox-tests').resolve())
          PYTHON
      - name: Verify all sandbox outcomes without suppressing live session assertions
        env:
          POT_SANDBOX_INTEGRATION: '1'
          POT_SANDBOX_SDK: ${{ github.workspace }}/.local/pot/sandbox-tests
        run: mise exec -- go test -v -race -failfast -count=3 ./pkg/executor -run '^TestRealSandbox'
