name: CI

# Diagnostic branch only. Never merge this replacement into main or PR #276.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Must remain false; this diagnostic never publishes
        type: boolean
        default: false
        required: false
permissions:
  contents: read
concurrency:
  group: native-release-diagnostic-${{ github.ref }}
  cancel-in-progress: false
env:
  MISE_AUTO_INSTALL: 'false'
jobs:
  native-diagnostic:
    name: Native fixture diagnostics (macos-26)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Confirm diagnostic source and nonpublication
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          test "$PUBLISH" = false
          case "$GITHUB_REF" in refs/heads/diagnostics/*) ;; *) exit 2 ;; esac
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "diagnostic_sha=$GITHUB_SHA production_base=61202a0c8995b0f99d1781e1aa4b535b987f22da publish=$PUBLISH"
          uname -srm
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.10.10
          cache: false
          install_args: go python node
      - name: Reproduce only selfupdate cleanup
        run: |
          mkdir -p .local/native-diagnostic
          set +e
          mise exec -- go test -v -count=3 -timeout=2m ./internal/selfupdate -run '^TestWorkerRestartsWholeInstallationAndRollsBack$/^cleanup$' 2>&1 | tee .local/native-diagnostic/selfupdate-cleanup.log
          result=${PIPESTATUS[0]}
          exit "$result"
      - name: Repeat original probe on native macOS
        if: ${{ !cancelled() }}
        run: |
          mkdir -p .local/native-diagnostic
          set +e
          mise exec -- go test -v -count=3 -timeout=2m ./internal/control -run '^TestScheduleProbeSecretIsolation$' 2>&1 | tee .local/native-diagnostic/probe-normal.log
          normal_status=${PIPESTATUS[0]}
          mise exec -- go test -race -v -count=3 -timeout=2m ./internal/control -run '^TestScheduleProbeSecretIsolation$' 2>&1 | tee .local/native-diagnostic/probe-race.log
          race_status=${PIPESTATUS[0]}
          printf 'normal_exit=%s race_exit=%s\n' "$normal_status" "$race_status"
          test "$normal_status" = 0 && test "$race_status" = 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-release-diagnostic
          path: .local/native-diagnostic/*.log
          if-no-files-found: warn
          retention-days: 7
