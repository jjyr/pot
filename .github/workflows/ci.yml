name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_AUTO_INSTALL: 'false'

jobs:
  product:
    name: Go product (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.10.10
          install_args: go python node ruff shfmt shellcheck swiftformat
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: go-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: go-v1-${{ runner.os }}-${{ runner.arch }}-
      - run: mise run check:go
      - run: mise run test
      - run: mise run test:executor
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap ripgrep socat
          # Qualification host must permit unprivileged bwrap/user namespaces.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: mise run test:sandbox
      - run: mise run test:i18n
      - run: mise run test:hooks
      - run: mise run licenses
      - run: mise run build:go
      - run: mise run build:linux
      - if: runner.os == 'macOS'
        run: mise run lint
      - if: runner.os == 'macOS'
        run: mise run test:release
      - if: runner.os == 'macOS'
        run: mise run build
