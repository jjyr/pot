name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Anonymously inspect four already published archives without executing their contents
        run: python3 scripts/public-package-inventory.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: public-package-inventory
          path: package-inventory.json
          retention-days: 7
