[tools]
go = "1.27.2"
node = "24.21.0"
python = "3.12.13"
hk = "2.4.0"
pkl = "0.32.1"
ruff = "0.16.10"
shfmt = "3.14.1"
shellcheck = "0.11.0"
swiftformat = "0.63.1"

[tasks.doctor]
description = "Check Apple Silicon macOS, Go, Node and Xcode prerequisites"
run = "python scripts/dev-check doctor"

[tasks.setup]
description = "Install repository-local Git hooks and check development prerequisites"
run = ["hk install --mise", "mise run doctor"]

[tasks.fmt]
description = "Format Go, Swift, Python and Shell sources"
run = "python scripts/dev-check fmt"

[tasks.lint]
description = "Check source formatting, localization and scripts"
run = "python scripts/dev-check lint"

[tasks.check]
description = "Check Go compilation, component boundaries and source formatting"
depends = ["lint", "check:go"]

[tasks.test]
description = "Test product contracts without model calls or VMs"
depends = ["test:go", "test:ui", "test:packaging", "test:eval", "test:public-api"]

[tasks.prepare]
description = "Prepare retained Node, JS plugins, and skills"
run = "python scripts/prepare-go-resources"

[tasks.build]
description = "Build the isolated Go/Wails macOS app with local execution"
run = "python scripts/build-go-app"

[tasks.bundle]
description = "Create a fresh complete macOS development bundle"
run = "python scripts/build-go-app"

[tasks.open]
description = "Open the isolated Go/Wails preview bundle"
run = "python scripts/pot open"

[tasks.server]
description = "Run the Go Runtime service"
run = "go run ./cmd/pot serve"

[tasks.release]
description = "Build local release ZIP, checksum and Homebrew cask without publishing"
usage = '''
arg "<version>" help="Release version, e.g. 0.1.0 or v0.1.0"
flag "--output <path>" default=".local/releases" help="Release artifact directory"
'''
run = 'python scripts/release "$usage_version" --output "$usage_output"'

[tasks."test:release"]
description = "Verify macOS release packaging without a build or VM"
run = "python scripts/tests/release-packaging.py"

[tasks."build:web-ui"]
description = "Verify and embed the shared HTML/CSS/JS product frontend"
run = "go build -mod=readonly ./web"

[tasks."build:cli"]
description = "Build a portable Go CLI archive with retained runtime assets"
run = "python scripts/build-go-cli"

[tasks."build:plugins"]
description = "Package tool plugins"
run = "python scripts/build-go-plugins"

[tasks.licenses]
description = "Collect notices for actual linked Go dependencies and runtime"
run = "python scripts/go-notices --output .local/licenses/go-dependencies.txt ./cmd/pot"

[tasks."test:ui"]
description = "Verify shared DOM composer and production owner-scoped state contracts"
run = ["node scripts/tests/go-ui-history.mjs", "node scripts/tests/go-ui-resource-cache.mjs", "node scripts/tests/go-ui-state.mjs", "node scripts/tests/go-ui-send-confirmation.mjs", "node scripts/tests/go-ui-production-state.mjs", "node scripts/tests/go-ui-usage.mjs", "node scripts/tests/script-runs.mjs", "node scripts/tests/go-ui-notifications.mjs", "node --test plugins/github/notifications.test.mjs plugins/codex/notifications.test.mjs", "node scripts/tests/go-ui-attachments.mjs", "node scripts/tests/go-ui-file-images.mjs", "node scripts/tests/go-ui-references.mjs", "node scripts/tests/web-errors.js"]

[tasks."test:executor"]
description = "Verify local executor process ownership, sessions and cleanup"
run = "go test -race ./pkg/executor ./pkg/pluginhost"

[tasks."test:hooks"]
description = "Verify hook timing and failure propagation"
run = "python scripts/tests/hook-timing.py"

[tasks."test:browser"]
description = "Verify browser process closure and observation bounds"
run = "node scripts/tests/browser-close.mjs"

[tasks."test:skill-authoring"]
description = "Verify builtin skill validation and installation helpers"
run = """
python -m venv .local/skill-tests
.local/skill-tests/bin/python -m pip install --disable-pip-version-check -r skills/skill-creator/scripts/requirements.txt
.local/skill-tests/bin/python scripts/tests/skill-authoring.py
"""

[tasks."test:plugin-notifications"]
description = "Verify GitHub background polling and durable assistant delivery"
run = ["node --test plugins/github/notifications.test.mjs", "go test -race ./internal/assistant ./internal/control -run 'TestPlugin|TestGitHubPlugin' -count=1"]

[tasks."test:i18n"]
description = "Verify shared product translation completeness"
run = "python scripts/tests/localization.py"

[tasks."test:eval"]
description = "Run deterministic CLI contracts without credentials or model calls"
run = """
set -eu
eval_root=$(mktemp -d "${TMPDIR:-/tmp}/pot-eval-ci.XXXXXX")
trap 'rm -rf "$eval_root"' EXIT
go run ./cmd/pot-eval suite deterministic "$eval_root/suite"
for scenario in short-chat tool-round compaction; do
  go run ./cmd/pot-eval run "eval/scenarios/$scenario.json" "$eval_root/$scenario"
  go run ./cmd/pot-eval validate "$eval_root/$scenario"
done
go run ./cmd/pot-eval run eval/scenarios/compaction.json "$eval_root/compaction-repeat"
go run ./cmd/pot-eval compare "$eval_root/compaction" "$eval_root/compaction-repeat"
"""

[tasks."check:go"]
description = "Check formatting, vet and package boundaries for Go packages"
run = "go run ./scripts/check-go"

[tasks."test:go"]
description = "Test Go product components with the race detector"
run = "go test -race ./..."

[tasks."build:go"]
description = "Build Go CLI independently of the desktop"
run = "go build -mod=readonly -trimpath -o .local/go/bin/ ./cmd/pot"

[tasks."build:linux"]
description = "Cross-build Go headless entry points without CGO or GUI dependencies"
run = '''
GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -mod=readonly -trimpath -o .local/go/linux-arm64/ ./cmd/pot
GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -mod=readonly -trimpath -o .local/go/linux-amd64/ ./cmd/pot
python scripts/build-go-plugins --platform linux-arm64 --output .local/go/linux-arm64/Resources/plugins
python scripts/build-go-plugins --platform linux-amd64 --output .local/go/linux-amd64/Resources/plugins
'''

[tasks."test:packaging"]
description = "Verify package layout, immutable export and service artifact generation"
run = ["python scripts/tests/go-packaging.py", "python integrations/codex/install_test.py"]

[tasks.preview]
description = "Run the disposable loopback shared UI preview (no model or product data)"
run = "go run ./cmd/pot preview"

[tasks."preview:app"]
description = "Run the disposable Wails main-window and tray preview"
depends = ["build"]
run = "open .local/go/PotGoPreview.app"

[tasks.icons]
description = "Generate brand assets from the retained native vector master"
run = """
mkdir -p .local/icons
xcrun swiftc -module-cache-path .local/icons/modules resources/app/PotIcon.swift scripts/make-icons.swift -o .local/icons/generate
.local/icons/generate
xcrun swiftc -module-cache-path .local/icons/modules resources/app/PotIcon.swift scripts/make-tray-atlas.swift -o .local/icons/tray-atlas
.local/icons/tray-atlas
"""

[tasks."test:ui-http-integration"]
description = "Opt-in real local browser/HTTP/SSE integration (cached Playwright CLI and browser required)"
run = "python scripts/tests/go-ui-http-integration.py"

[tasks."test:public-api"]
description = "Verify reusable Go libraries from an independent external module"
run = "python scripts/tests/go-public-api.py"

[tasks."test:sandbox"]
description = "Qualify real SRT file, network, socket, PTY and cleanup boundaries"
run = "python scripts/tests/sandbox.py"

[tasks."test:sandbox-linux"]
description = "Qualify Linux namespaces in a disposable Docker test host"
run = "python scripts/tests/sandbox-linux.py"

[tasks."test:codex-bridge"]
description = "Verify Codex REST/SSE, supervised JSONL, local MCP and durable inbox integration"
run = ["go test -race ./integrations/codex/bridge ./pkg/pluginhost ./pkg/integrations/codex", "go test -race ./internal/control -run TestCodexBridge -count=1", "node --test plugins/codex/notifications.test.mjs", "python integrations/codex/install_test.py"]
