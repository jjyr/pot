[tools]
go = "1.27.2"
node = "24.21.0"
python = "3.12.13"
hk = "2.4.0"
pkl = "0.32.1"
ruff = "0.16.10"
shfmt = "3.14.1"
shellcheck = "0.11.0"
swiftformat = "0.63.1"

[tasks.doctor]
description = "Check Apple Silicon macOS, Go, Node and Xcode prerequisites"
run = "python scripts/dev-check doctor"

[tasks.setup]
description = "Install repository-local Git hooks and check development prerequisites"
run = ["hk install --mise", "mise run doctor"]

[tasks.fmt]
description = "Format Go, Swift, Python and Shell sources"
run = "python scripts/dev-check fmt"

[tasks.lint]
description = "Check source formatting, localization and scripts"
run = "python scripts/dev-check lint"

[tasks.check]
description = "Check Go compilation, component boundaries and source formatting"
depends = ["lint", "check:go"]

[tasks."check:ci"]
description = "Run full source, architecture and localization checks"
depends = ["check", "test:i18n", "test:hooks", "licenses"]
run = ["python scripts/tests/go-test-plan.py", "python scripts/test_go.py core --list", "python scripts/tests/docker-entrypoint.py"]

[tasks."ci:normal"]
description = "Run normal tests and ancillary CI gates concurrently on one runner"
depends = ["test:go:ci", "check:ci", "test:contracts", "test:release"]

[tasks."ci:light"]
description = "Run automatic PR/main core and static contracts on one Linux runner"
depends = ["lint", "test:i18n", "test:core", "test:ui", "test:packaging"]
run = ["go run ./scripts/check-go", "go test ./scripts/check-go", "python scripts/tests/public-release-verification.py", "python scripts/tests/release-candidate.py", "python scripts/tests/docker-entrypoint.py"]

[tasks."test:go:ci"]
description = "Run complete normal Go coverage without test-result caching"
run = "python scripts/test_go.py normal --count=1"

[tasks.test]
description = "Test product contracts without model calls"
depends = ["test:go", "test:race", "test:ui", "test:packaging", "test:eval", "test:public-api"]

[tasks."test:core"]
description = "Run local core logic and selected lifecycle/security integration tests"
run = ["python scripts/tests/go-test-plan.py", "python scripts/test_go.py core --count=1"]

[tasks."test:contracts"]
description = "Verify UI, packaging, deterministic CLI and public API contracts"
depends = ["test:ui", "test:packaging", "test:eval", "test:public-api"]

[tasks."check:push"]
description = "Run the local pre-push gate (full normal/race suites run in CI)"
run = "hk run pre-push --all"

[tasks.prepare]
description = "Prepare retained Node, JS plugins, and skills"
run = "python scripts/prepare-pot-resources"

[tasks.build]
description = "Build the isolated Pot/Wails macOS app with local execution"
run = "python scripts/build-pot-app"

[tasks.bundle]
description = "Create a fresh complete macOS development bundle"
run = "python scripts/build-pot-app"

[tasks.open]
description = "Open the isolated Pot/Wails preview bundle"
run = "python scripts/pot open"

[tasks.server]
description = "Run the Pot Runtime service"
run = "go run ./cmd/pot serve"

[tasks.release]
description = "Build local release ZIP, checksum and Homebrew cask without publishing"
usage = '''
arg "<version>" help="Release version, e.g. 0.1.0 or v0.1.0"
flag "--output <path>" default=".local/releases" help="Release artifact directory"
'''
run = 'python scripts/release "$usage_version" --output "$usage_output"'

[tasks."release:prepare"]
description = "Prepare a remote release candidate on trusted GitHub Actions"
run = "python scripts/release-control prepare"

[tasks."release:publish"]
description = "Publish the exact manifest from one successful remote prepare run"
run = "python scripts/release-control publish"

[tasks."release:homebrew"]
description = "Retry Homebrew proposal for an already published version"
run = "python scripts/release-control homebrew"

[tasks."release:status"]
description = "Show release Actions phases, candidate expiry and Homebrew state"
run = "python scripts/release-control status"

[tasks."verify:release"]
description = "Verify a public version and signed downloads with a trusted pinned key"
run = "python scripts/verify-release"

[tasks."test:release"]
description = "Verify release packaging, candidate provenance, promotion and public verification protocols"
run = ["python scripts/tests/release-packaging.py", "python scripts/tests/public-release-verification.py", "python scripts/tests/release-candidate.py"]

[tasks."test:macos-update"]
description = "Build two disposable App versions and simulate native upgrade/recovery"
run = "python scripts/tests/macos-update-smoke.py --build"

[tasks."build:web-ui"]
description = "Verify and embed the shared HTML/CSS/JS product frontend"
run = "go build -mod=readonly ./web"

[tasks."build:cli"]
description = "Build a portable Pot CLI archive with retained runtime assets"
run = "python scripts/build-pot-cli"

[tasks."build:plugins"]
description = "Package tool plugins"
run = "python scripts/build-pot-plugins"

[tasks.licenses]
description = "Collect notices for actual linked Go dependencies and runtime"
run = "python scripts/go-notices --output .local/licenses/go-dependencies.txt ./cmd/pot"

[tasks."test:ui"]
description = "Verify shared DOM composer and production owner-scoped state contracts"
depends = ["test:ui-fluid", "test:assistant-creation", "test:ui-native"]
run = ["node --test scripts/tests/ui-regression-plan.test.mjs", "node scripts/tests/pot-ui-service-worker.mjs", "node scripts/tests/pot-ui-preferences.mjs", "node --test pkg/mcp/node_runtime.test.mjs", "node scripts/tests/pot-ui-updates.mjs", "node scripts/tests/pot-ui-extensions.mjs", "node scripts/tests/local-form-concurrency.mjs", "node scripts/tests/assistant-editor-resume.mjs", "node scripts/tests/local-refresh-scheduling.mjs", "node scripts/tests/changes-generation.mjs", "node scripts/tests/pot-ui-history.mjs", "node scripts/tests/retained-chat.mjs", "node scripts/tests/stable-message-rows.mjs", "node scripts/tests/projection-lifetime.mjs", "node scripts/tests/pot-ui-scroll-input.mjs", "node scripts/tests/pot-ui-chat-sync.mjs", "node scripts/tests/ws-client.mjs", "node scripts/tests/browser-ws-fixture.mjs", "node scripts/tests/ws-lifecycle.mjs", "node scripts/tests/pot-ui-resource-cache.mjs", "node scripts/tests/pot-ui-domains.mjs", "node scripts/tests/schedules-domain-contract.mjs", "node scripts/tests/pot-ui-query-resource-refresh.mjs", "node scripts/tests/cache-reading-p1.mjs", "node scripts/tests/pot-ui-display-resources.mjs", "node scripts/tests/resource-bytes-adapter.mjs", "node scripts/tests/resource-directory-generation.mjs", "node scripts/tests/pot-ui-topology.mjs", "node scripts/tests/pot-ui-agent-links.mjs", "node scripts/tests/pot-ui-state.mjs", "node scripts/tests/pot-ui-schedule-probe.mjs", "node scripts/tests/pot-ui-send-confirmation.mjs", "node scripts/tests/chat-outbox-dispatch.mjs", "node scripts/tests/outbox-terminal-identity.mjs", "node scripts/tests/pot-ui-production-state.mjs", "node scripts/tests/pot-ui-settings-access.mjs", "node scripts/tests/pot-ui-provider-plugins.mjs", "node scripts/tests/pot-ui-usage.mjs", "node scripts/tests/script-runs.mjs", "node scripts/tests/work-records.mjs", "node scripts/tests/pot-ui-notifications.mjs", "node scripts/tests/pot-ui-github-subscriptions.mjs", "node --test plugins/github/*.test.mjs", "node scripts/tests/pot-ui-attachments.mjs", "node scripts/tests/pot-ui-file-images.mjs", "node scripts/tests/pot-ui-message-files.mjs", "node scripts/tests/pot-ui-references.mjs", "node scripts/tests/pot-ui-message-identities.mjs", "node scripts/tests/pot-ui-communication.mjs", "node scripts/tests/pot-ui-composer-selectors.mjs", "node scripts/tests/web-errors.js"]




[tasks."test:ui-native"]
description = "Verify retained desktop startup and shared WebSocket routing without a WebView"
run = ["node scripts/tests/desktop-startup.mjs", "node scripts/tests/native-subscription.mjs", "node scripts/tests/native-bridge-integration.mjs"]

[tasks."test:executor"]
description = "Verify local executor process ownership, sessions and cleanup"
run = "go test -race ./pkg/executor ./pkg/pluginhost"

[tasks."test:ui-fluid"]
description = "Verify bounded task catalogues, progressive loading and targeted invalidation"
run = ["node scripts/tests/pot-ui-task-pages.mjs", "node scripts/tests/task-identity.mjs", "node scripts/tests/record-groups.mjs"]

[tasks."test:assistant-creation"]
description = "Verify one-click assistant creation, retries and Space ownership"
run = "node scripts/tests/pot-ui-assistant-creation.mjs"

[tasks."test:ui-prepared-layout"]
description = "Verify prepared conversation output, native aliases and touch geometry with isolated browser fixtures"
run = ["node scripts/tests/render-snapshot.mjs", "node scripts/tests/prepared-group-intent-browser.mjs", "node scripts/tests/prepared-communication-context-browser.mjs", "node scripts/tests/prepared-controller-browser.mjs", "node scripts/tests/prepared-resources-browser.mjs", "node scripts/tests/prepared-chat-browser.mjs", "node scripts/tests/prepared-history-resources-browser.mjs", "node scripts/tests/prepared-group-alias-browser.mjs", "node scripts/tests/prepared-touch-browser.mjs", "node scripts/tests/chat-stability-browser.mjs", "node scripts/tests/chat-composer-focus-browser.mjs", "node scripts/tests/chat-layout-regression-browser.mjs", "node scripts/tests/resource-silent-loading-browser.mjs", "node scripts/tests/assistant-model-input-browser.mjs", "node scripts/tests/assistant-task-default-browser.mjs", "node scripts/tests/page-loading-browser.mjs", "node scripts/tests/loading-feedback-browser.mjs", "node scripts/tests/image-preview-browser.mjs"]

[tasks."test:settings-browser"]
description = "Verify settings reads, drafts and writes independently of assistant activity with synthetic WebSocket services"
run = "node scripts/tests/pot-ui-settings-independent-browser.mjs"

[tasks."test:ui-local-first"]
description = "Verify local display before transport, stable cache upgrades and editor authority"
run = ["node scripts/tests/directory-local-first.mjs", "node scripts/tests/directory-local-first-browser.mjs", "node scripts/tests/stable-projections-browser.mjs", "node scripts/tests/settings-local-first-browser.mjs"]

[tasks."test:mcp-ui"]
description = "Verify MCP connection local display, current authority, OAuth forms and cache upgrades in a real browser"
run = ["node scripts/tests/mcp-connections-browser.mjs", "node scripts/tests/mcp-cache-migration-browser.mjs", "node scripts/tests/mcp-onboarding-browser.mjs"]

[tasks."test:hooks"]
description = "Verify hook timing and failure propagation"
run = "python scripts/tests/hook-timing.py"

[tasks."test:browser"]
description = "Verify browser process closure and observation bounds"
run = "node scripts/tests/browser-close.mjs"

[tasks."test:skill-authoring"]
description = "Verify builtin skill validation and installation helpers"
run = """
python -m venv .local/skill-tests
.local/skill-tests/bin/python -m pip install --disable-pip-version-check -r skills/skill-creator/scripts/requirements.txt
.local/skill-tests/bin/python scripts/tests/skill-authoring.py
"""

[tasks."test:plugin-notifications"]
description = "Verify GitHub background polling and durable assistant delivery"
run = ["node --test plugins/github/*.test.mjs", "go test -race ./internal/assistant ./internal/control -run 'TestPlugin|TestGitHubPlugin' -count=1"]

[tasks."test:pwa-cold-start"]
description = "Verify local-first browser startup using isolated WebSockets, IndexedDB and a real Service Worker"
run = ["node scripts/tests/pot-ui-cold-start-browser.mjs", "node scripts/tests/pot-ui-reconnect-authority-browser.mjs", "node scripts/tests/directory-status-recovery-browser.mjs"]

[tasks."test:pwa"]
description = "Verify isolated system notification, Web Push and browser lifecycle contracts"
run = ["go test ./internal/systemnotifications ./internal/browsernotifications ./internal/pwapush ./internal/webui ./pkg/storage ./web", "node scripts/tests/pot-ui-notifications.mjs", "node scripts/tests/pot-ui-service-worker.mjs", "node scripts/tests/pot-pwa-browser.mjs"]

[tasks."test:i18n"]
description = "Verify shared product translation completeness"
run = "python scripts/tests/localization.py"

[tasks."test:work-records"]
description = "Verify compact work grouping and shared display identities"
run = ["node scripts/tests/task-identity.mjs", "node scripts/tests/work-records.mjs", "node scripts/tests/pot-ui-communication.mjs", "node scripts/tests/pot-ui-message-identities.mjs"]

[tasks."test:eval"]
description = "Run deterministic CLI contracts without credentials or model calls"
run = """
set -eu
eval_root=$(mktemp -d "${TMPDIR:-/tmp}/pot-eval-ci.XXXXXX")
trap 'rm -rf "$eval_root"' EXIT
go run ./cmd/pot-eval suite deterministic "$eval_root/suite"
for scenario in short-chat tool-round compaction; do
  go run ./cmd/pot-eval run "eval/scenarios/$scenario.json" "$eval_root/$scenario"
  go run ./cmd/pot-eval validate "$eval_root/$scenario"
done
go run ./cmd/pot-eval run eval/scenarios/compaction.json "$eval_root/compaction-repeat"
go run ./cmd/pot-eval compare "$eval_root/compaction" "$eval_root/compaction-repeat"
"""

[tasks."check:go"]
description = "Check formatting, vet and package boundaries for Go packages"
run = "go run ./scripts/check-go"

[tasks."test:go"]
description = "Run all Go tests without race instrumentation"
run = ["python scripts/tests/go-test-plan.py", "python scripts/test_go.py normal"]

[tasks."test:race"]
description = "Race-check concurrent product paths with explicit serial-test exclusions"
run = "python scripts/test_go.py race"

[tasks."test:race:all"]
description = "Explicit full Go race suite for concurrency/storage architecture changes"
run = "python scripts/test_go.py race-all"

[tasks."build:go"]
description = "Build Go CLI independently of the desktop"
run = "go build -mod=readonly -trimpath -o .local/pot/bin/ ./cmd/pot"

[tasks."build:linux"]
description = "Cross-build Go headless entry points without CGO or GUI dependencies"
run = '''
GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -mod=readonly -trimpath -o .local/pot/linux-arm64/ ./cmd/pot
GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -mod=readonly -trimpath -o .local/pot/linux-amd64/ ./cmd/pot
python scripts/build-pot-plugins --platform linux-arm64 --output .local/pot/linux-arm64/Resources/plugins
python scripts/build-pot-plugins --platform linux-amd64 --output .local/pot/linux-amd64/Resources/plugins
'''

[tasks."test:packaging"]
description = "Verify package layout, immutable export and service artifact generation"
run = ["python scripts/tests/pot-packaging.py", "python integrations/codex/install_test.py", "python integrations/antigravity/install_test.py"]

[tasks.preview]
description = "Run the disposable loopback shared UI preview (no model or product data)"
run = "go run ./cmd/pot preview"

[tasks."preview:app"]
description = "Run the disposable Wails main-window and tray preview"
depends = ["build"]
run = "open .local/pot/PotPreview.app"

[tasks.icons]
description = "Generate brand assets from the retained native vector master"
run = """
mkdir -p .local/icons
xcrun swiftc -module-cache-path .local/icons/modules resources/app/PotIcon.swift scripts/make-icons.swift -o .local/icons/generate
.local/icons/generate
xcrun swiftc -module-cache-path .local/icons/modules resources/app/PotIcon.swift scripts/make-tray-atlas.swift -o .local/icons/tray-atlas
.local/icons/tray-atlas
"""

[tasks."test:ui-http-integration"]
description = "Opt-in real local browser/WebSocket integration (cached Playwright CLI and browser required)"
run = "python scripts/tests/ui-http-suite.py"

[tasks."test:public-api"]
description = "Verify reusable Go libraries from an independent external module"
run = ["python scripts/tests/go-public-api-harness.py", "python scripts/tests/go-public-api.py"]

[tasks."test:sandbox"]
description = "Qualify real SRT file, network, socket, PTY and cleanup boundaries"
run = "python scripts/tests/sandbox.py"

[tasks."test:sandbox-linux"]
description = "Qualify Linux namespaces in a disposable Docker test host"
run = "python scripts/tests/sandbox-linux.py"

[tasks."test:codex-agent"]
description = "Verify Codex MCP stdio, supervised App Server and durable inbox integration"
run = ["go test -race ./internal/agenthost ./cmd/pot-codex-agent ./pkg/pluginhost", "python integrations/codex/install_test.py", "python integrations/antigravity/install_test.py"]

[tasks."test:antigravity-agent"]
description = "Verify native Antigravity sessions, scoped management and plugin installation"
run = ["go test -race ./internal/agenthost ./pkg/agentlink ./pkg/storage", "python integrations/antigravity/install_test.py"]

[tasks."test:ui-scroll"]
description = "Trusted wheel continuity, mixed/nested heights and reading anchors (isolated Chromium)"
run = "node scripts/tests/ui-regressions.mjs --group scroll"

[tasks."test:ui-chat-position"]
description = "Send and assistant-switch position contracts with isolated WebSockets and IndexedDB"
run = "node scripts/tests/chat-scroll-http-browser.mjs"

[tasks."test:ui-assistant-create"]
description = "Phone assistant creation with isolated WebSockets, IndexedDB and trusted touch"
run = "node scripts/tests/assistant-create-mobile-browser.mjs"

[tasks."test:ui-chat-activity"]
description = "Stable execution activity across reconnect, model/tool rounds and parallel inputs"
run = ["node scripts/tests/chat-activity-browser.mjs", "node scripts/tests/chat-history-diagnostics-browser.mjs"]

[tasks."test:ui-nav"]
description = "Trusted touch Back intermediate frames and keyed conversation navigation"
run = "node scripts/tests/ui-regressions.mjs --group nav"

[tasks."test:ui-mobile-chat-back"]
description = "Phone edge Back, browser directory history and retained conversation identity"
run = "node scripts/tests/mobile-chat-back-browser.mjs"

[tasks."test:ui-history"]
description = "Automatic Task history, bounded reads, retry and cancellation"
run = "node scripts/tests/ui-regressions.mjs --group history"

[tasks."test:ui-domain"]
description = "Domain progress, scope, shared commands and committed IndexedDB publication"
run = ["node scripts/tests/pot-ui-domains.mjs", "node scripts/tests/ui-regressions.mjs --group domain"]

[tasks."test:ui-storage"]
description = "Real IndexedDB integrity, read volume, namespace and transaction contracts"
run = "node scripts/tests/ui-regressions.mjs --group storage"

[tasks."test:ui-regressions"]
description = "All deterministic browser regression groups; authenticated gateway qualification is separate"
run = "node scripts/tests/ui-regressions.mjs"

[tasks."test:ui-memory"]
description = "Bounded long-history JS heap and release after closing (isolated Chromium)"
run = "node scripts/tests/scroll-memory-browser.mjs"
