[tools]
"conda:brotli-bin" = "1.2.0"
go = "1.27.2"
node = "24.21.0"
rust = { version = "beta-2026-10-14", mr_boxington = true }
mr-boxington = "1.24.0"
python = "3.12.13"
zig = "0.15.2"
"cargo:cargo-zigbuild" = "0.23.4"
"github:EmbarkStudios/cargo-about" = "0.9.2"
hk = "2.4.0"
pkl = "0.32.1"
ruff = "0.16.10"
shfmt = "3.14.1"
shellcheck = "0.11.0"
swiftformat = "0.63.1"

[env]
CARGO_TARGET_DIR = "{{config_root}}/.local/poc/cargo-target"

[tasks.doctor]
description = "Check macOS, Xcode and cross-compilation prerequisites"
run = "python scripts/dev-check doctor"

[tasks.setup]
description = "Prepare Rust components and install repository-local Git hooks"
run = ["rustup component add rustfmt clippy", "rustup target add aarch64-unknown-linux-musl", "hk install --mise", "mise run doctor"]

[tasks.fmt]
description = "Format Rust, Swift, Python and Shell sources"
run = "python scripts/dev-check fmt"

[tasks.lint]
description = "Check source formatting and basic script correctness"
run = "python scripts/dev-check lint"

[tasks."check:rust"]
run = "cargo check --workspace --locked -j 4"

[tasks.clippy]
description = "Lint every Rust workspace target, treating warnings as errors"
run = "cargo clippy --workspace --all-targets --locked -j 4 -- -D warnings"

[tasks."clippy:backend"]
description = "Lint portable backend targets without the macOS App"
run = "cargo clippy --workspace --exclude pot-app --all-targets --locked -j 4 -- -D warnings"

[tasks.check]
description = "Run formatting, script and Rust compilation checks"
depends = ["lint", "check:rust", "check:swift"]

[tasks.test]
description = "Run backend crate tests without model calls"
depends = ["test:architecture"]
run = '''
test_key_dir=$(mktemp -d)
trap 'rm -rf "$test_key_dir"' EXIT
export POT_SECRET_KEY_FILE="$test_key_dir/key"
python -c 'import os, secrets; p = os.environ["POT_SECRET_KEY_FILE"]; fd = os.open(p, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600); os.write(fd, secrets.token_bytes(32)); os.close(fd)'
cargo test --locked -p pot-core -p pot-storage -p pot-usage -p pot-agent -p pot-tool-executor -p pot-gateway -p pot-model-protocol -p pot-assistant -p pot-relay -p pot-secrets -p pot-runner -p pot-control -p pot-runtime -p pot-runtime-execution -p pot-server -p pot-protocol -p pot-eval -p pot-sandbox -p pot-sandbox-macos-apple-container -p pot-sandbox-macos-apple-vm -p pot-sandbox-linux-podman -p pot-resource -p pot-sandbox-images -j 4
'''

[tasks."test:executor"]
description = "Verify executor receipts, idle expiry and orphan cleanup without a VM"
run = "python scripts/tests/executor-lifecycle.py"

[tasks."test:hooks"]
description = "Verify hook timing and failure propagation"
run = "python scripts/tests/hook-timing.py"

[tasks."test:operation-prepare"]
description = "Verify guest argument preparation without authorization state"
run = "python scripts/tests/operation-prepare.py"

[tasks."test:browser"]
description = "Qualify persistent CUA plugin text and mixed observations against a Chromium fixture"
run = "python scripts/tests/browser.py"

[tasks."test:skills"]
description = "Verify guest per-scope skills mount policy without a VM"
run = "python scripts/tests/skill-mounts.py"

[tasks."test:skill-authoring"]
description = "Verify builtin skill validation and installation helpers"
run = """
python -m venv .local/skill-tests
.local/skill-tests/bin/python -m pip install --disable-pip-version-check -r skills/skill-creator/scripts/requirements.txt
.local/skill-tests/bin/python scripts/tests/skill-authoring.py
"""

[tasks."test:app"]
depends = ["test:app-safety"]
run = "cargo test --locked -p pot-app -j 4"

[tasks."test:app-safety"]
description = "Verify native Helper failure and conversation draft receipt handling"
run = """
mkdir -p .local/client-safety
xcrun swiftc -module-cache-path .local/client-safety/modules crates/app/swift/ClientSafety.swift crates/app/swift/tests/ClientSafetyTests.swift -o .local/client-safety/tests
.local/client-safety/tests
"""

[tasks."test:i18n"]
description = "Verify translation coverage, native language preferences and web localization"
run = "python scripts/tests/localization.py"

[tasks."test:eval"]
description = "Run deterministic CLI contracts without credentials or model calls"
run = """
set -eu
eval_root=$(mktemp -d "${TMPDIR:-/tmp}/pot-eval-ci.XXXXXX")
trap 'rm -rf "$eval_root"' EXIT
cargo run --locked -p pot-eval -- suite deterministic "$eval_root/suite"
for scenario in short-chat tool-round compaction; do
  cargo run --locked -p pot-eval -- run "crates/eval/scenarios/$scenario.json" "$eval_root/$scenario"
  cargo run --locked -p pot-eval -- validate "$eval_root/$scenario"
done
cargo run --locked -p pot-eval -- run crates/eval/scenarios/compaction.json "$eval_root/compaction-repeat"
cargo run --locked -p pot-eval -- compare "$eval_root/compaction" "$eval_root/compaction-repeat"
"""

[tasks.licenses]
description = "Check Rust dependency licenses and generate bundled notices"
run = """
mkdir -p .local/licenses
cargo about generate --locked --workspace --fail about.hbs --output-file .local/licenses/rust-dependencies.html
"""

[tasks."test:licenses"]
description = "Verify disallowed and unknown license expressions fail"
run = "python scripts/tests/licenses.py"

[tasks.prepare]
run = "scripts/pot prepare"
[tasks.build]
run = "scripts/pot build"
[tasks.bundle]
run = "scripts/pot bundle"
[tasks.open]
run = "scripts/pot open"

[tasks.release]
description = "Build the release ZIP, checksum and Homebrew cask (pass a version)"
usage = '''
arg "<version>" help="Release version, e.g. 0.1.0 or v0.1.0"
flag "--output <path>" default=".local/releases" help="Release artifact directory"
'''
run = 'python scripts/release "$usage_version" --output "$usage_output"'

[tasks."test:release"]
description = "Verify macOS release packaging without a build or VM"
run = "python scripts/tests/release-packaging.py"

[tasks."check:swift"]
description = "Compile Helper executables without starting a VM"
run = "env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_COMMON_DIR swift build -c release --package-path helper --disable-sandbox --scratch-path .local/d1/helper-build --force-resolved-versions -j 4"
env = { SWIFTPM_MODULECACHE_OVERRIDE = "{{config_root}}/.local/d1/swift-modules", CLANG_MODULE_CACHE_PATH = "{{config_root}}/.local/d1/clang-modules" }

[tasks.server]
description = "Run the standalone backend without App or Helper"
run = "cargo run --locked -p pot-server --bin pot -- serve"

[tasks."build:web"]
description = "Build desktop templates and page-specific translation resources"
run = "python scripts/localize-web"

[tasks."build:web-ui"]
description = "Build the pinned nightly GPUI Web/WASM app and browser assets"
run = "python scripts/build-web-ui"

[tasks."test:web-assets"]
description = "Test Web build and compression cache invalidation"
run = "python scripts/tests/web-assets.py"

[tasks."test:ui"]
description = "Test portable shared UI state and locale contracts"
run = "cargo test --locked -p pot-ui -p pot-avatar -j 4"

[tasks."build:cli"]
description = "Build standalone CLI with embedded Web UI and a release archive"
run = "python scripts/build-cli"

[tasks."build:sandbox-image"]
description = "Build guest executor and OCI image separately from client packaging"
run = """
cargo zigbuild --locked --release --target aarch64-unknown-linux-musl -p pot-tool-executor -j 4
cp .local/poc/cargo-target/aarch64-unknown-linux-musl/release/pot-tool-executor .local/d1/resources/pot-tool-executor
scripts/build-image
"""
[tasks."export:sandbox-resources"]
description = "Validate deterministic resource assets against the embedded catalog"
run = "python scripts/export-sandbox-resources"

[tasks."build:container-image"]
description = "Build the Linux Podman OCI image from the shared Dockerfile"
run = "python scripts/build-container-image"

[tasks."test:clients"]
description = "Verify independent browser clients, concurrency, streams and reconnects"
run = "cargo test --locked -p pot-server --test multi_clients -j 4"

[tasks."build:tailscale"]
description = "Build embedded libtailscale and automatic tailnet HTTPS"
run = "python scripts/build-tailscale"

[tasks."test:architecture"]
description = "Guard independently testable component dependency boundaries"
run = "python scripts/tests/architecture.py"

[tasks."check:go"]
description = "Check formatting, vet and package boundaries for the Go migration"
run = "go run ./scripts/check-go"

[tasks."test:go"]
description = "Test Go migration components with the race detector"
run = "go test -race ./..."

[tasks."test:go-ui"]
description = "Verify shared DOM composer and owner-scoped preview state"
run = "node scripts/tests/go-ui-state.mjs"

[tasks."build:go"]
description = "Build Go CLI and executor independently of the desktop"
run = "go build -mod=readonly -trimpath -o .local/go/bin/ ./cmd/pot ./cmd/pot-tool-executor"

[tasks."build:go-linux"]
description = "Cross-build Go headless entry points without CGO or GUI dependencies"
run = '''
GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -mod=readonly -trimpath -o .local/go/linux-arm64/ ./cmd/pot ./cmd/pot-tool-executor
GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -mod=readonly -trimpath -o .local/go/linux-amd64/ ./cmd/pot ./cmd/pot-tool-executor
'''

[tasks."build:go-app"]
description = "Build the complete independent macOS Go/Wails app and retained Swift Helpers"
run = "python scripts/build-go-app"

[tasks."prepare:go"]
description = "Prepare pinned Node, JS plugins, skills, viewer and license resources"
run = "python scripts/prepare-go-resources"

[tasks."build:go-cli"]
description = "Build a portable native Go CLI archive with retained runtime assets"
run = "python scripts/build-go-cli"

[tasks."build:go-image"]
description = "Build the Go Linux guest image separately from App packaging"
run = "python scripts/build-go-image"

[tasks."build:go-container-image"]
description = "Build a rootless Podman image containing the Go executor"
run = "python scripts/build-go-container-image"

[tasks."export:go-sandbox-resources"]
description = "Verify deterministic Go guest exports against the embedded catalog"
run = "python scripts/export-go-sandbox-resources"

[tasks."test:go-packaging"]
description = "Verify Go-only package layout, immutable export and service artifact generation"
run = "python scripts/tests/go-packaging.py"

[tasks."preview:go"]
description = "Run the disposable loopback shared UI preview (no model or product data)"
run = "go run ./cmd/pot preview"

[tasks."preview:go-app"]
description = "Run the disposable Wails main-window and tray preview"
depends = ["build:go-app"]
run = "open .local/go/PotGoPreview.app"

[tasks.icons]
description = "Generate all brand assets from the canonical native vector master"
run = """
mkdir -p .local/icons
xcrun swiftc -module-cache-path .local/icons/modules crates/app/swift/PotIcon.swift scripts/make-icons.swift -o .local/icons/generate
.local/icons/generate
"""
