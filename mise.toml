[tools]
rust = "1.98.1"
python = "3.12.13"
zig = "0.15.2"
"cargo:cargo-zigbuild" = "0.23.4"
"github:EmbarkStudios/cargo-about" = "0.9.2"
hk = "2.4.0"
pkl = "0.32.1"
ruff = "0.16.10"
shfmt = "3.14.1"
shellcheck = "0.11.0"
swiftformat = "0.63.1"

[env]
CARGO_TARGET_DIR = "{{config_root}}/.local/poc/cargo-target"

[tasks.doctor]
description = "Check macOS, Xcode and cross-compilation prerequisites"
run = "python scripts/dev-check doctor"

[tasks.setup]
description = "Prepare Rust components and install repository-local Git hooks"
run = ["rustup component add rustfmt clippy", "rustup target add aarch64-unknown-linux-musl", "hk install --mise", "mise run doctor"]

[tasks.fmt]
description = "Format Rust, Swift, Python and Shell sources"
run = "python scripts/dev-check fmt"

[tasks.lint]
description = "Check source formatting and basic script correctness"
run = "python scripts/dev-check lint"

[tasks."check:rust"]
run = "cargo check --workspace --locked -j 4"

[tasks.clippy]
description = "Lint every Rust workspace target, treating warnings as errors"
run = "cargo clippy --workspace --all-targets --locked -j 4 -- -D warnings"

[tasks."clippy:backend"]
description = "Lint portable backend targets without the macOS App"
run = "cargo clippy --workspace --exclude pot-app --all-targets --locked -j 4 -- -D warnings"

[tasks.check]
description = "Run formatting, script and Rust compilation checks"
depends = ["lint", "check:rust", "check:swift"]

[tasks.test]
description = "Run backend crate tests without model calls"
run = "cargo test --locked -p pot-core -p pot-storage -p pot-driver -p pot-agent -p pot-tool-executor -p pot-gateway -p pot-runtime -p pot-server -p pot-protocol -p pot-eval -j 4"

[tasks."test:skills"]
description = "Verify guest per-scope skills mount policy without a VM"
run = "python scripts/tests/skill-mounts.py"

[tasks."test:skill-authoring"]
description = "Verify builtin skill validation and installation helpers"
run = """
python -m venv .local/skill-tests
.local/skill-tests/bin/python -m pip install --disable-pip-version-check -r skills/skill-creator/scripts/requirements.txt
.local/skill-tests/bin/python scripts/tests/skill-authoring.py
"""

[tasks."test:app"]
run = "cargo test --locked -p pot-app -j 4"

[tasks."test:i18n"]
description = "Verify translation coverage, native language preferences and web localization"
run = "python scripts/tests/localization.py"

[tasks."test:eval"]
description = "Run deterministic CLI contracts without credentials or model calls"
run = """
set -eu
eval_root=$(mktemp -d "${TMPDIR:-/tmp}/pot-eval-ci.XXXXXX")
trap 'rm -rf "$eval_root"' EXIT
cargo run --locked -p pot-eval -- suite deterministic "$eval_root/suite"
for scenario in short-chat tool-round compaction; do
  cargo run --locked -p pot-eval -- run "eval/scenarios/$scenario.json" "$eval_root/$scenario"
  cargo run --locked -p pot-eval -- validate "$eval_root/$scenario"
done
cargo run --locked -p pot-eval -- run eval/scenarios/compaction.json "$eval_root/compaction-repeat"
cargo run --locked -p pot-eval -- compare "$eval_root/compaction" "$eval_root/compaction-repeat"
"""

[tasks.licenses]
description = "Check Rust dependency licenses and generate bundled notices"
run = """
mkdir -p .local/licenses
cargo about generate --locked --workspace --fail about.hbs --output-file .local/licenses/rust-dependencies.html
"""

[tasks."test:licenses"]
description = "Verify disallowed and unknown license expressions fail"
run = "python scripts/tests/licenses.py"

[tasks.prepare]
run = "scripts/pot prepare"
[tasks.build]
run = "scripts/pot build"
[tasks.bundle]
run = "scripts/pot bundle"
[tasks.open]
run = "scripts/pot open"

[tasks.release]
description = "Build the release ZIP, checksum and Homebrew cask (pass a version)"
usage = '''
arg "<version>" help="Release version, e.g. 0.1.0 or v0.1.0"
flag "--output <path>" default=".local/releases" help="Release artifact directory"
'''
run = 'python scripts/release "$usage_version" --output "$usage_output"'

[tasks."test:release"]
description = "Verify macOS release packaging without a build or VM"
run = "python scripts/tests/release-packaging.py"

[tasks."check:swift"]
description = "Compile Helper executables without starting a VM"
run = "swift build -c release --package-path helper --disable-sandbox --scratch-path .local/d1/helper-build --force-resolved-versions -j 4"
env = { SWIFTPM_MODULECACHE_OVERRIDE = "{{config_root}}/.local/d1/swift-modules", CLANG_MODULE_CACHE_PATH = "{{config_root}}/.local/d1/clang-modules" }

[tasks.server]
description = "Run the standalone backend without App or Helper"
run = "cargo run --locked -p pot-server --bin pot -- serve"

[tasks."build:mobile"]
description = "Build the pinned nightly GPUI Web/WASM app and browser assets"
run = "python scripts/build-mobile"

[tasks."test:ui"]
description = "Test portable shared UI state and locale contracts"
run = "cargo test --locked -p pot-ui -j 4"

[tasks."build:cli"]
description = "Build standalone CLI with embedded Web UI and a release archive"
run = "python scripts/build-cli"
