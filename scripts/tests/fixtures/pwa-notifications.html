<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>System notifications fixture</title><link rel="stylesheet" href="/web/src/styles.css"><body><main class="settings-page" style="max-width:740px;margin:64px auto;padding:24px"><h1>Settings</h1><div id="setting"></div></main><script type="module">
const params=new URLSearchParams(location.search);const source=params.has('before')?'/before':'/web/src';
const {createSystemNotifications}=await import(source+'/adapters/notifications.mjs');

const client={production:false,desktop:false,runtime:{runtime_id:'fixture'},assistants:[],spaces:[]};
const notifications=createSystemNotifications({client,surface:'main',view:()=>({}),open:()=>{},locale:()=>params.get('locale')||'en',host:fakeHost});

</script></body></html>
