<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/web/src/styles.css"><title>Chat fixture</title><div id="app"></div>
<script type="module">
import {mountApp} from '/web/src/components/ui.js';
import {createProductionClient,APIError} from '/web/src/adapters/production.mjs';
const metrics={frames:[],pages:[],errors:[]};window.addEventListener('error',event=>metrics.errors.push(event.message));window.addEventListener('unhandledrejection',event=>metrics.errors.push(event.reason?.stack||String(event.reason)));
const NativeSocket=WebSocket,sources=new Set(),subscriptions=new WeakMap();window.WebSocket=class extends NativeSocket{constructor(...args){super(...args);sources.add(this);subscriptions.set(this,new Map());this.addEventListener('message',event=>{let envelope;try{envelope=JSON.parse(event.data);}catch{return;}if(envelope?.type!=='event'||envelope.event!=='conversation')return;const path=subscriptions.get(this)?.get(envelope.id);if(path!=='/api/v1/events')return;const frame=envelope.data;metrics.frames.push({kind:frame.kind,bytes:new TextEncoder().encode(JSON.stringify(frame)).length,count:frame.view.messages.length,cursor:frame.view.state.cursor});});this.addEventListener('close',()=>sources.delete(this));}send(data){try{const frame=JSON.parse(data);if(frame?.type==='subscribe'&&frame.id&&frame.path)subscriptions.get(this)?.set(frame.id,new URL(frame.path,location.href).pathname);}catch{}return super.send(data);}close(...args){sources.delete(this);return super.close(...args);}};
const client=await createProductionClient();const history=client.history;let failPage=false;
localStorage.setItem('pot-system-notifications-browser-v1','false');
const subscribe=client.subscribe,shortMode=new URLSearchParams(location.search).get('short');let shortReset=shortMode!==null;
client.subscribe=(receive,...args)=>subscribe((snapshot,...rest)=>{
  if(shortReset&&snapshot.kind==='reset'){shortReset=false;let messages=snapshot.messages.filter(message=>!message.context_only).slice(-2);if(shortMode==='complete')messages=messages.map((message,index)=>({...message,sequence:String(index+1)}));snapshot={...snapshot,messages,history:{...snapshot.history,before:messages[0].sequence,after:messages.at(-1).sequence}};}
  receive(snapshot,...rest);
},...args);
client.history=async(query,options)=>{if(failPage){failPage=false;throw new APIError(503,{code:'fixture_offline'});}const page=await history(query,options);metrics.pages.push({query,count:page.messages.length});return page;};
// Synthetic attachment bytes are delayed locally; all chat/history/WS requests
// use the real Application above. These refs never touch product attachments.
const urls=new Map();client.attachmentURL=async attachment=>{await new Promise(resolve=>setTimeout(resolve,350));if(!urls.has(attachment.id)){const svg='<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260"><rect width="400" height="260" fill="#e9b96e"/><text x="80" y="140" font-size="26">Synthetic image</text></svg>';urls.set(attachment.id,URL.createObjectURL(new Blob([attachment.id==='fixture-image'?svg:'%PDF-1.4 fixture'],{type:attachment.id==='fixture-image'?'image/svg+xml':'application/pdf'})));}return urls.get(attachment.id);};client.downloadAttachment=async()=>{};
const dispose=mountApp(document.querySelector('#app'),client);window.fixture={client,metrics,failPage:()=>failPage=true,disconnect(){for(const socket of sources)if([...(subscriptions.get(socket)?.values()??[])].includes('/api/v1/events'))socket.close();},dispose};window.addEventListener('pagehide',()=>{dispose();for(const url of urls.values())URL.revokeObjectURL(url);});
</script></html>
