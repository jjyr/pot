<!doctype html><html><head><meta charset="utf-8"><title>Tasks and schedules scroll regression</title></head><body style="margin:0">
<output id="result" style="display:block;height:40px;overflow:auto">Running production-component scroll checks…</output>
<iframe title="Production tasks and schedules" style="display:block;border:0;height:calc(100vh - 40px);max-width:100%"></iframe>
<script>
const params=new URLSearchParams(location.search),frame=document.querySelector('iframe');
frame.style.width=(params.get('width')||1280)+'px';params.delete('width');params.set('verify-scroll','1');
frame.src='tasks-schedules.html?'+params;
addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==frame.contentWindow||event.data?.type!=='tasks-scroll-result')return;document.querySelector('#result').textContent=(event.data.passed?'PASS':'FAIL')+' '+event.data.width+'px: '+(event.data.error||event.data.checks.length+' checks; '+event.data.checks.join('; '));});
</script></body></html>
