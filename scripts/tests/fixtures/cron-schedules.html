<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cron browser regression</title><link rel="stylesheet" href="/web/src/styles.css"></head>
<body class="pot-app" style="display:block;width:100%;height:100vh">
<h1>Cron browser regression</h1><main style="height:85vh;overflow:auto;width:100%"></main>
<script type="module">
// Serve from the repository root with TestHistoryBrowserFixture's private API.
// ?mobile=1 runs the same editor checks inside a real 390px frame viewport.
if(new URLSearchParams(location.search).has('mobile')){
  document.body.replaceChildren(Object.assign(document.createElement('iframe'),{title:'390px mobile Cron regression',src:location.pathname,style:'width:390px;height:844px;border:0'}));
}else{
  const {runCronRegression}=await import('../pot-ui-cron.mjs');
  try{
    const checks=await runCronRegression();
    document.body.replaceChildren(Object.assign(document.createElement('h1'),{textContent:`PASS: ${checks.length} Cron UI checks`}),Object.assign(document.createElement('pre'),{textContent:checks.join('\n'),style:'white-space:pre-wrap'}));
  }catch(error){
    document.body.replaceChildren(Object.assign(document.createElement('h1'),{textContent:'FAIL'}),Object.assign(document.createElement('pre'),{textContent:error.stack}));
  }
}
</script></body></html>
