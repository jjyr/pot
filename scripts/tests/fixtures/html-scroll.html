<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HTML scroll boundary fixture</title><link rel="stylesheet" href="/web/src/styles.css"><style>
html,body{overflow:auto;height:auto}body{background:var(--canvas);min-height:calc(100vh + 600px)}main{max-width:900px;margin:20px auto;padding:0 18px}h1{font-size:20px}nav{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}button{padding:7px}.history{display:block;height:510px;overflow:auto;border:1px solid var(--divider);padding:16px;scroll-behavior:auto}.spacer{height:1000px;color:var(--muted)}.reply-bubble{max-width:100%;width:100%}.resource-interactive{height:340px}#metrics{height:100px;overflow:auto;overflow-wrap:anywhere;white-space:pre-wrap;font:13px monospace;background:var(--surface);padding:12px}#outside{padding:12px;border:1px dashed var(--muted)}body.narrow main{max-width:390px}
</style></head><body><main><h1>HTML preview · synthetic scroll boundary</h1><nav><button id="long">Long HTML</button><button id="nested">Nested list</button><button id="short">Short HTML</button><button id="historical">Historical presentation</button><button id="reset">Reset chat to middle</button><button id="theme">Switch theme</button></nav><div id="outside">Native preview boundary · live scroll positions below</div><pre id="metrics">Loading</pre><div class="history" tabindex="0"><div class="spacer">Earlier synthetic conversation</div><article id="message"></article><p id="inline"></p><div class="spacer">Later synthetic conversation</div></div></main><script>for(const type of ["error","unhandledrejection"])addEventListener(type,event=>document.querySelector("#metrics").textContent=String(event.error?.stack||event.reason?.stack||event.message));</script><script type="module">
import {createProductionClient} from '/web/src/adapters/production.mjs';
import {createReplyBubble} from '/web/src/components/reply.mjs';
import {createMessageFile} from '/web/src/components/message-file.mjs';
import {translate} from '/web/src/locales/messages.mjs';
const params=new URLSearchParams(location.search);document.documentElement.dataset.theme=params.get('theme')||'light';document.documentElement.lang=params.get('locale')||'en';document.body.classList.toggle('narrow',params.has('narrow'));
const client=await createProductionClient();const snapshot=await client.snapshot();client.setScope({owner:snapshot.conversation_id,space:''});
const rows=(await Promise.all(snapshot.messages.filter(m=>m.role==='assistant').map(m=>client.messageFiles(m.id)))).flat().filter(row=>row.state==='ready');
const history=document.querySelector('.history'),host=document.querySelector('#message'),inline=document.querySelector('#inline');
let reply,kind='long',historical=false;
const options={t:key=>translate(document.documentElement.lang,key),messageFiles:async()=>rows,acquireResource:resource=>client.acquireResource(resource,{owner:snapshot.conversation_id,space:''}),downloadResource:resource=>client.downloadResource(resource,{owner:snapshot.conversation_id,space:''})};
function metrics(){const frame=document.querySelector('dialog iframe')||host.querySelector('iframe'),card=frame?.closest('pot-resource');return {kind,historical,chat:history.scrollTop,page:document.scrollingElement.scrollTop,pageMax:document.scrollingElement.scrollHeight-document.scrollingElement.clientHeight,chatMax:history.scrollHeight-history.clientHeight,dialog:!!document.querySelector('dialog[open]'),locked:history.style.overflow,focus:document.activeElement?.tagName+(document.activeElement?.textContent||'').slice(0,28),frame:card?.querySelector('.resource-result-value')?.textContent||'',sandbox:frame?.getAttribute('sandbox')};}
function sample(){document.querySelector('#metrics').textContent=JSON.stringify(metrics());}setInterval(sample,80);
async function mount(next=kind,legacy=historical){kind=next;historical=legacy;host.replaceChildren();inline.replaceChildren();const row=rows.find(r=>r.resource.entry===`scroll-${kind}.html`);if(!row)throw Error('Missing synthetic resource');reply=createReplyBubble(host);reply.update(historical?{text:'',phase:'complete',presentation:{resource:row.resource,mode:'preview',caption:row.label}}:{id:'scroll-fixture',text:`[${row.label}](${row.href})`,phase:'complete'},options);inline.append(createMessageFile({href:row.href,label:'Open HTML viewer',block:false},'scroll-fixture',options));await new Promise(resolve=>setTimeout(resolve,250));history.scrollTop=1100;sample();}
for(const name of ['long','nested','short'])document.querySelector('#'+name).onclick=()=>mount(name,false);document.querySelector('#historical').onclick=()=>mount(kind,true);document.querySelector('#reset').onclick=()=>{history.scrollTop=1100;sample()};document.querySelector('#theme').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'};
window.htmlScrollFixture={metrics,mount,history,client,rows};await mount();window.fixtureReady=true;
</script></body></html>
