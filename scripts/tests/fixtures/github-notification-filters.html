<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GitHub subscriptions fixture</title><link rel="stylesheet" href="/web/src/styles.css"><body><main style="max-width:760px;margin:auto;padding:20px" id="fixture"></main><script type="module">
const params=new URLSearchParams(location.search);
if(params.has('phone')){params.delete('phone');const frame=document.createElement('iframe');frame.title='393px phone viewport';frame.style.cssText='width:393px;height:760px;border:0';frame.src=location.pathname+'?'+params;document.body.replaceChildren(frame);}else{
const {createPluginNotifications}=await import('/web/src/components/plugin-notifications.mjs');
let locale=params.get('locale')||'en',revision=1,rejectSave=false,delaySave=false,finish;
const account={identity:{id:'fixture-account',username:'fixture-user'}};
const filters=(repositories=null,reasons=null)=>({repositories,reasons,subject_types:null,threads:null});
const fields=['repositories','reasons','subject_types','threads'].map(key=>({key,label:'pluginNotifications.'+key,...(key==='reasons'?{options:['mention','team_mention','review_requested','subscribed','comment','author'].map(value=>({value,label:'pluginNotifications.reason.'+value}))}:key==='subject_types'?{options:['Issue','PullRequest','Release'].map(value=>({value}))}:{})}));
const sub=(id,assistant,repositories,reasons)=>({id,assistant,enabled:true,account_id:'fixture-account',revision:1,status:'ready',filters:filters(repositories,reasons)});
let data={items:[{id:'github',settings:{account_id:'fixture-account',revision,fields,subscriptions:[sub('default','main',null,['mention']),sub('fiber-B','B',['nervosnetwork/fiber'],null),sub('personal-C','C',['jjyr/pot','jjyr/personal-one','jjyr/personal-two'],null)]}}],assistants:[{id:'main',name:'Pot'},{id:'B',name:'B'},{id:'C',name:'C'}]};
const root=document.querySelector('#fixture'),controls=document.createElement('nav');
const button=(label,run)=>{const b=document.createElement('button');b.textContent=label;b.onclick=run;controls.append(b);};
button('Switch language',()=>{locale=locale==='en'?'zh-CN':'en';render();});
button('Toggle save error',()=>{rejectSave=!rejectSave;});
button('Toggle delayed save',()=>{delaySave=!delaySave;});
button('Complete save',()=>finish?.());
button('Simulate tool edit',()=>{const settings=data.items[0].settings;settings.revision=++revision;settings.subscriptions[0].revision++;settings.subscriptions[0].filters.reasons=['review_requested'];form.update(data,account);render();});
const details=document.createElement('details');details.open=true;const summary=document.createElement('summary');summary.textContent='GitHub · fixture-user';details.append(summary);const content=document.createElement('div');details.append(content);root.append(controls,details);
const form=createPluginNotifications({pluginID:'github',request:async(path,{body})=>{
 if(delaySave)await new Promise(resolve=>{finish=resolve;});if(rejectSave)throw Error('fixture save error');
 const {tool,arguments:args}=body,settings=data.items[0].settings,index=settings.subscriptions.findIndex(s=>s.id===args.id);
 if(tool!=='create_subscription'&&(index<0||settings.subscriptions[index].revision!==args.revision))throw Error('stale subscription revision');
 if(tool==='delete_subscription')settings.subscriptions.splice(index,1);
 else{const sub={...args,id:args.id||'created-fixture-'+revision,revision:(args.revision||0)+1,status:'ready'};if(index<0)settings.subscriptions.push(sub);else settings.subscriptions[index]=sub;}
 settings.revision=++revision;return structuredClone(data);
 },scope:{},signal:new AbortController().signal,locale:()=>locale,refresh:async()=>{form.update(data,account);},render});
function render(){content.replaceChildren(form.form());}
form.update(data,account);render();
}
</script></body></html>
