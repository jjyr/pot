<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/web/src/styles.css">
<title>Composer selectors fixture</title>
<div id="app"></div>
<script type="module">
// A fixed-width phone frame lets browser tools with a fixed desktop viewport
// exercise the real responsive UI. The mobile query simulates device detection;
// it does not claim to exercise an OS keyboard or native IME.
const url=new URL(location.href);
if(url.searchParams.has('phone')){
  url.searchParams.delete('phone');url.searchParams.set('mobile','1');
  const frame=document.createElement('iframe');frame.src=url;
  frame.style.cssText='box-sizing:content-box;width:390px;height:744px;border:1px solid #888;display:block;margin:20px auto';
  document.querySelector('#app').replaceWith(frame);
}else await import('../go-ui-composer-selectors-browser.mjs');
</script>
</html>
