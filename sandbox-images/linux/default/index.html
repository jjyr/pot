<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pot Sandbox</title>
<style>
:root{color-scheme:light;--bg:#fdfdfd;--surface:#fff;--panel:#f4f4f4;--ink:#262626;--muted:#646464;--line:#e8e8e8;--blue:#0068da;--error:#bd342d;--success:#247844;--attention:#885b13}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#202020;--surface:#2b2b2b;--panel:#282828;--ink:#f2f2f2;--muted:#b7b7b7;--line:#414141;--blue:#0a84ff;--error:#ff6961;--success:#78be8a;--attention:#d7af66}}
:root[data-theme=dark]{color-scheme:dark;--bg:#202020;--surface:#2b2b2b;--panel:#282828;--ink:#f2f2f2;--muted:#b7b7b7;--line:#414141;--blue:#0a84ff;--error:#ff6961;--success:#78be8a;--attention:#d7af66}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,sans-serif;height:100vh;display:flex;flex-direction:column}
header{height:56px;display:flex;align-items:center;gap:12px;padding:0 24px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}header strong{font-size:16px;font-weight:600}
button,select{font:13px -apple-system,BlinkMacSystemFont,sans-serif;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:6px;min-height:28px;padding:4px 10px;cursor:pointer;transition:background-color 140ms ease,border-color 140ms ease,box-shadow 140ms ease}
button:disabled{opacity:.45;cursor:default}button:not(:disabled):hover{background:var(--panel)}button:not(:disabled):active{box-shadow:inset 0 1px 3px #0001}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
#take{background:var(--blue);color:white;border-color:transparent}#take:not(:disabled):hover{filter:brightness(.94);background:var(--blue)}.spacer{flex:1}.status{color:var(--muted);font-size:12px}
main{flex:1;min-height:0;display:flex;background:var(--panel)}#screen{flex:1;min-width:0;overflow:hidden}aside{width:300px;max-width:42vw;flex-shrink:0;background:var(--surface);padding:24px;overflow:auto;border-left:1px solid var(--line);animation:surface-in 180ms ease-out}[hidden]{display:none!important}
aside h2{font-size:16px;font-weight:600;margin:0 0 24px}dt{font-size:12px;color:var(--muted);margin:20px 0 6px}dd{margin:0;line-height:1.6;overflow-wrap:anywhere;font-size:13px;font-variant-numeric:tabular-nums}footer{height:36px;display:flex;align-items:center;gap:16px;padding:0 24px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}footer select{font-size:12px;min-height:24px;padding:2px 6px}
.error{padding:10px 24px;background:color-mix(in srgb,var(--error) 7%,var(--bg));color:var(--error);font-size:13px;line-height:1.5}
#menu{position:absolute;right:20px;top:52px;padding:4px;background:var(--surface);border:1px solid var(--line);box-shadow:0 6px 24px #0002;border-radius:7px;z-index:5;animation:surface-in 160ms ease-out}#menu button{display:block;width:100%;text-align:left;border:0;background:transparent;margin:2px 0}#menu button:not(:disabled):hover{background:var(--panel)}body.native #menu{top:8px}
dialog{color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;width:420px;max-width:calc(100vw - 48px);box-shadow:0 12px 40px #0002}dialog[open]{animation:surface-in 200ms ease-out}dialog p{font-size:13px;color:var(--muted);line-height:1.5}dialog textarea{width:100%;height:140px;margin:12px 0;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:12px;font:13px -apple-system,BlinkMacSystemFont,sans-serif}dialog::backdrop{background:#0003}
#connection{display:inline-block;width:7px;height:7px;flex-shrink:0;border-radius:50%;background:var(--attention);cursor:help}#connection[data-state=connected]{background:var(--success)}#connection[data-state=disconnected],#connection[data-state=error]{background:var(--error)}#connection:focus-visible{outline:2px solid var(--blue);outline-offset:4px}
@keyframes surface-in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><!-- POT_LOCALIZATION_START -->
<script>
const potTranslations={"en":{"web.give-back-control":"Give back control","web.take-over":"Take over","web.you-are-in-control":"You are in control","web.viewing-control-returned":"Viewing · Control returned","web.viewing-not-taken-over":"Viewing · Not taken over","web.connected":"Connected","web.connecting":"Connecting…","web.desktop-disconnected":"Desktop disconnected","web.connection-interrupted":"Connection interrupted","web.cannot-connect-to-the-desktop-service-reconnect":"Cannot connect to the desktop service. Reconnect or check the environment.","web.unable-to-switch-control":"Unable to switch control:","web.unavailable":"Unavailable","web.sampling":"Sampling","web.metrics-unavailable":"Metrics unavailable","web.reconnect-desktop":"Reconnect desktop","web.open-browser":"Open browser","web.clipboard":"Clipboard…","web.open-workspace":"Open workspace","web.manage-environment":"Manage environment…","web.stop-environment":"Stop environment…","web.restart-environment":"Restart environment…","web.environment-information":"Environment information","web.environment":"Environment","web.local-linux-vm-arm64":"Local Linux VM · ARM64","web.status":"Status","web.running":"Running","web.image":"Image","web.loading":"Loading…","web.sandbox-image-compressed-layers":"Sandbox image (compressed layers)","web.uptime":"Uptime","web.cpu-average-across-all-vcpus":"CPU (average across all vCPUs)","web.memory-used-vm-available":"Memory (used / VM available)","web.system-disk-used-filesystem-capacity":"System disk (used / filesystem capacity)","web.work-files":"Work files","web.stored-independently-excluded-from-the-system-disk":"Stored independently; excluded from the system disk.","web.logical-file-sizes-refreshed-every-30-seconds":"Logical file sizes; refreshed every 30 seconds.","web.viewing":"Viewing","web.display":"Display ","web.fit-to-window":"Fit to window","web.actual-size":"Actual size","web.desktop-clipboard":"Desktop clipboard","web.after-sending-press-ctrl-v-in-the":"After sending, press Ctrl+V in the remote application to paste.","web.send-to-desktop":"Send to desktop","web.close":"Close","web.more-actions":"More actions","web.clipboard-text":"Clipboard text","web.pot-work-desktop":"Pot · Work desktop","web.your-work-desktop":"Your work desktop","web.this-is-where-pot-works":"This is where Pot works.","web.watch-its-progress-or-take-over-the":"Watch its progress or take over the mouse and keyboard.","web.open-a-website-using-the-address-bar":"Open a website using the address bar. When finished, click “Give back control”.","web.closing-the-browser-keeps-the-desktop-and":"Closing the browser keeps the desktop and chat running.","web.configured-memory":" (configured: {memory} GiB)","web.uptime.one":"{count} minute","web.uptime.other":"{count} minutes","web.take-over-first":"Take over the desktop first"},"zh-CN":{"web.give-back-control":"交还控制","web.take-over":"接管","web.you-are-in-control":"你正在控制","web.viewing-control-returned":"正在查看 · 控制权已交还","web.viewing-not-taken-over":"正在查看 · 尚未接管","web.connected":"已连接","web.connecting":"连接中…","web.desktop-disconnected":"桌面已断开","web.connection-interrupted":"连接中断","web.cannot-connect-to-the-desktop-service-reconnect":"无法连接桌面服务，请重连或检查环境状态。","web.unable-to-switch-control":"控制权切换失败：","web.unavailable":"暂不可用","web.sampling":"正在采样","web.metrics-unavailable":"指标暂不可用","web.reconnect-desktop":"重新连接桌面","web.open-browser":"打开浏览器","web.clipboard":"剪贴板…","web.open-workspace":"打开工作目录","web.manage-environment":"管理环境…","web.stop-environment":"停止环境…","web.restart-environment":"重启环境…","web.environment-information":"环境信息","web.environment":"环境","web.local-linux-vm-arm64":"本地 Linux VM · ARM64","web.status":"状态","web.running":"运行中","web.image":"镜像","web.loading":"正在读取…","web.sandbox-image-compressed-layers":"Sandbox 镜像（压缩层大小）","web.uptime":"运行时间","web.cpu-average-across-all-vcpus":"CPU（所有 vCPU 的平均使用率）","web.memory-used-vm-available":"内存（使用 / VM 可用）","web.system-disk-used-filesystem-capacity":"系统盘（使用 / 文件系统容量）","web.work-files":"工作文件","web.stored-independently-excluded-from-the-system-disk":"独立持久保存，不计入系统盘。","web.logical-file-sizes-refreshed-every-30-seconds":"按文件逻辑大小统计，每 30 秒更新。","web.viewing":"正在查看","web.display":"显示 ","web.fit-to-window":"适应窗口","web.actual-size":"原始大小","web.desktop-clipboard":"桌面剪贴板","web.after-sending-press-ctrl-v-in-the":"发送后，在远端应用中按 Ctrl+V 粘贴。","web.send-to-desktop":"发送到桌面","web.close":"关闭","web.more-actions":"更多操作","web.clipboard-text":"剪贴板文本","web.pot-work-desktop":"Pot · 工作桌面","web.your-work-desktop":"你的工作桌面","web.this-is-where-pot-works":"这里是 Pot 工作的地方。","web.watch-its-progress-or-take-over-the":"你可以查看进展，也可以接管鼠标和键盘。","web.open-a-website-using-the-address-bar":"通过上方地址栏打开网页。操作完成后，点击「交还控制」。","web.closing-the-browser-keeps-the-desktop-and":"关闭浏览器后，桌面与聊天会继续运行。","web.configured-memory":"（配置 {memory} GiB）","web.uptime.one":"{count} 分钟","web.uptime.other":"{count} 分钟","web.take-over-first":"请先接管桌面"}};
window.potLocale = 'en';
window.potT = key => potTranslations[window.potLocale]?.[key] ?? potTranslations.en[key] ?? key;
window.potF = (key, args) => potT(key).replace(/\{(\w+)\}/g, (match, name) => args[name] ?? match);
window.potNumber = (number, digits = 0) => new Intl.NumberFormat(window.potLocale, {minimumFractionDigits: digits, maximumFractionDigits: digits}).format(number);
window.potSetLocale = language => {
    const locale = language === 'zh-CN' ? 'zh-CN' : 'en';
    window.potLocale = locale;
    document.documentElement.lang = locale;
    try { localStorage.setItem('pot-language', locale); } catch {}
    document.querySelectorAll('[data-pot-i18n]').forEach(el => el.textContent = potT(el.dataset.potI18n));
    for (const attribute of ['title', 'aria-label']) {
        document.querySelectorAll('[data-pot-' + attribute + ']').forEach(el => el.setAttribute(attribute, potT(el.getAttribute('data-pot-' + attribute))));
    }
    window.dispatchEvent(new Event('pot-locale'));
};
const potInitialLocale = () => {
    try { const saved = localStorage.getItem('pot-language'); if (['en', 'zh-CN'].includes(saved)) return saved; } catch {}
    for (const language of navigator.languages ?? []) {
        const base = language.replaceAll('_', '-').toLowerCase().split('-')[0];
        if (base === 'zh') return 'zh-CN';
        if (base === 'en') return 'en';
    }
    return 'en';
};
document.addEventListener('DOMContentLoaded', () => potSetLocale(potInitialLocale()));
</script>
<!-- POT_LOCALIZATION_END -->
<body>
<header><strong>Sandbox</strong><span id="connection" data-state="connecting" role="img" tabindex="0" title="连接中…" data-pot-title="web.connecting" aria-label="连接中…" data-pot-aria-label="web.connecting"></span><span class="spacer"></span><button id="take"><span data-pot-i18n="web.take-over">接管</span></button><button id="info" title="环境信息" data-pot-title="web.environment-information" aria-label="环境信息" data-pot-aria-label="web.environment-information" aria-expanded="false">ⓘ</button><button id="more" title="更多操作" data-pot-title="web.more-actions" aria-label="更多操作" data-pot-aria-label="web.more-actions" aria-expanded="false">···</button></header>
<div id="error" class="error" role="alert" hidden></div>
<div id="menu" hidden><button id="connect"><span data-pot-i18n="web.reconnect-desktop">重新连接桌面</span></button><button id="browser" disabled><span data-pot-i18n="web.open-browser">打开浏览器</span></button><button id="clipboardOpen" disabled><span data-pot-i18n="web.clipboard">剪贴板…</span></button><button id="workspace"><span data-pot-i18n="web.open-workspace">打开工作目录</span></button><button id="manage"><span data-pot-i18n="web.manage-environment">管理环境…</span></button><button id="stop"><span data-pot-i18n="web.stop-environment">停止环境…</span></button><button id="restart"><span data-pot-i18n="web.restart-environment">重启环境…</span></button></div>
<main><div id="screen"></div><aside id="details" hidden><h2><span data-pot-i18n="web.environment-information">环境信息</span></h2><dl><dt><span data-pot-i18n="web.environment">环境</span></dt><dd><span data-pot-i18n="web.local-linux-vm-arm64">本地 Linux VM · ARM64</span></dd><dt><span data-pot-i18n="web.status">状态</span></dt><dd id="environment"><span data-pot-i18n="web.running">运行中</span></dd><dt><span data-pot-i18n="web.image">镜像</span></dt><dd id="image"><span data-pot-i18n="web.loading">正在读取…</span></dd><dt><span data-pot-i18n="web.sandbox-image-compressed-layers">Sandbox 镜像（压缩层大小）</span></dt><dd id="imageSize"><span data-pot-i18n="web.loading">正在读取…</span></dd><dt><span data-pot-i18n="web.uptime">运行时间</span></dt><dd id="uptime">—</dd><dt><span data-pot-i18n="web.cpu-average-across-all-vcpus">CPU（所有 vCPU 的平均使用率）</span></dt><dd id="cpu">—</dd><dt><span data-pot-i18n="web.memory-used-vm-available">内存（使用 / VM 可用）</span></dt><dd id="memory">—</dd><dt><span data-pot-i18n="web.system-disk-used-filesystem-capacity">系统盘（使用 / 文件系统容量）</span></dt><dd id="disk">—</dd><dt><span data-pot-i18n="web.work-files">工作文件</span></dt><dd><span id="workspaceSize"><span data-pot-i18n="web.loading">正在读取…</span></span><br><span data-pot-i18n="web.stored-independently-excluded-from-the-system-disk">独立持久保存，不计入系统盘。</span><br><span data-pot-i18n="web.logical-file-sizes-refreshed-every-30-seconds">按文件逻辑大小统计，每 30 秒更新。</span></dd></dl></aside></main>
<footer><span id="owner"><span data-pot-i18n="web.viewing">正在查看</span></span><span class="spacer"></span><label><span data-pot-i18n="web.display">显示 </span><select id="scale"><option value="fit"><span data-pot-i18n="web.fit-to-window">适应窗口</span></option><option value="actual"><span data-pot-i18n="web.actual-size">原始大小</span></option></select></label></footer>
<dialog id="clipboardDialog"><strong><span data-pot-i18n="web.desktop-clipboard">桌面剪贴板</span></strong><p><span data-pot-i18n="web.after-sending-press-ctrl-v-in-the">发送后，在远端应用中按 Ctrl+V 粘贴。</span></p><textarea id="clipboard" aria-label="剪贴板文本" data-pot-aria-label="web.clipboard-text"></textarea><button id="paste"><span data-pot-i18n="web.send-to-desktop">发送到桌面</span></button> <button id="closeClipboard"><span data-pot-i18n="web.close">关闭</span></button></dialog>
<script type="module">
import RFB from '/novnc/core/rfb.js';
const token=location.hash.slice(1),$=id=>document.getElementById(id);let rfb,state,controlDown=false,connected=false,connecting=true,refreshing=false;
function publish(){window.webkit?.messageHandlers.potDesktop.postMessage({action:'viewer-state',connected,connecting,human:state?.owner==='human',info:!$('details').hidden})}
if(new URLSearchParams(location.search).has('native')){document.body.classList.add('native');document.querySelector('header').hidden=true;}
function connection(kind,label){const dot=$('connection');dot.dataset.state=kind;dot.title=label;dot.setAttribute('aria-label',label);publish()}
function error(message=''){$('error').hidden=!message;$('error').textContent=message}
async function api(path,body){const res=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{'X-Pot-Token':token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(!res.ok){const detail=(await res.text()).slice(0,300);throw Error(detail==='take_over_required'?potT('web.take-over-first'):detail);}return res.json()}
// Normalize native accessibility mouse metadata for the noVNC canvas.
document.addEventListener('mousedown',e=>{if(e.target.tagName==='CANVAS'&&e.buttons===0)Object.defineProperty(e,'buttons',{value:[1,4,2][e.button]||0})},true);
for(const type of ['keydown','keyup'])document.addEventListener(type,e=>{if(e.target.tagName==='CANVAS'&&rfb&&state?.owner==='human'&&controlDown!==e.ctrlKey){controlDown=e.ctrlKey;rfb.sendKey(0xffe3,'ControlLeft',controlDown)}},true);
async function refresh(){if(refreshing)return;refreshing=true;try{const epoch=state?.epoch;state=await api('status');if(epoch!==state.epoch)controlDown=false;const human=state.owner==='human';if(rfb)rfb.viewOnly=!human;$('take').textContent=human?potT("web.give-back-control"):potT("web.take-over");$('owner').textContent=human?potT("web.you-are-in-control"):state.owner==='agent'?potT("web.viewing-control-returned"):potT("web.viewing-not-taken-over");for(const id of ['browser','clipboardOpen','paste'])$(id).disabled=!human;connection(connected?'connected':connecting?'connecting':'disconnected',connected?potT("web.connected"):connecting?potT("web.connecting"):potT("web.desktop-disconnected"));}catch(e){connection('error',potT("web.connection-interrupted"));error(potT("web.cannot-connect-to-the-desktop-service-reconnect"))}finally{refreshing=false}}
function connect(){controlDown=false;connected=false;connecting=true;connection('connecting',potT("web.connecting"));if(rfb)rfb.disconnect();$('screen').replaceChildren();const current=new RFB($('screen'),`ws://${location.host}/rfb?token=${encodeURIComponent(token)}`);rfb=current;rfb.scaleViewport=$('scale').value==='fit';rfb.viewOnly=true;rfb.addEventListener('connect',()=>{if(rfb!==current)return;connected=true;connecting=false;connection('connected',potT("web.connected"));error();refresh()});rfb.addEventListener('disconnect',()=>{if(rfb!==current)return;connected=false;connecting=false;connection('disconnected',potT("web.desktop-disconnected"));refresh()});rfb.addEventListener('clipboard',e=>$('clipboard').value=e.detail.text)}
$('take').onclick=async()=>{const action=state?.owner==='human'?'return':'take';$('take').disabled=true;try{if(action==='return'&&rfb)rfb.viewOnly=true;await api('control',{action});error();await refresh()}catch(e){error(potT("web.unable-to-switch-control")+e.message);await refresh()}finally{$('take').disabled=false}};
$('connect').onclick=()=>{connect();$('menu').hidden=true};
$('browser').onclick=async()=>{try{await api('browser',{});error();$('menu').hidden=true}catch(e){error(e.message)}};
$('more').onclick=()=>{$('menu').hidden=!$('menu').hidden;$('more').setAttribute('aria-expanded',!$('menu').hidden)};
$('info').onclick=()=>{$('details').hidden=!$('details').hidden;$('info').setAttribute('aria-expanded',!$('details').hidden);if(!$('details').hidden)metrics();publish()};
$('scale').onchange=()=>{if(rfb)rfb.scaleViewport=$('scale').value==='fit'};
$('clipboardOpen').onclick=()=>{$('menu').hidden=true;$('clipboardDialog').showModal()};$('closeClipboard').onclick=()=>$('clipboardDialog').close();$('paste').onclick=()=>{if(state?.owner==='human'){rfb?.clipboardPasteFrom($('clipboard').value);$('clipboardDialog').close()}};
for(const id of ['workspace','manage','stop','restart'])$(id).onclick=()=>{window.webkit?.messageHandlers.potDesktop.postMessage({action:id});$('menu').hidden=true};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('menu').hidden=true});
const gib=n=>potNumber(n/1024**3,2)+' GiB';
async function metrics(){try{const m=await api('metrics');$('image').textContent=m.image||potT("web.unavailable");$('imageSize').textContent=m.image_bytes==null?potT("web.unavailable"):potNumber(m.image_bytes/1024**2,1)+' MiB';$('cpu').textContent=(m.cpu_percent==null?potT("web.sampling"):m.cpu_percent+'%')+' / '+m.cpus+' vCPU';$('memory').textContent=gib(m.memory_used)+' / '+gib(m.memory_total)+potF('web.configured-memory',{memory:potNumber(m.memory_gib)});$('disk').textContent=gib(m.disk_used)+' / '+gib(m.disk_total);$('workspaceSize').textContent=m.workspace_bytes==null?potT("web.unavailable"):potNumber(m.workspace_bytes/1024**2,2)+' MiB';$('uptime').textContent=potF(Math.floor(m.uptime_seconds/60)===1?'web.uptime.one':'web.uptime.other',{count:potNumber(Math.floor(m.uptime_seconds/60))});}catch(e){$('environment').textContent=potT("web.metrics-unavailable")}}
window.addEventListener('pot-locale',()=>{refresh();if(!$('details').hidden)metrics();if(new URLSearchParams(location.search).has('native'))api('locale',{locale:window.potLocale}).catch(()=>{});});
setInterval(refresh,1500);setInterval(()=>{if(!$('details').hidden)metrics();publish()},2500);connect();
</script></body></html>
