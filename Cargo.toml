[workspace]
resolver = "3"
members = ["crates/resource", "crates/sandbox-images", "crates/app", "crates/protocol", "crates/core", "crates/storage", "crates/agent", "crates/tool-executor", "crates/gateway", "crates/runtime", "crates/server", "crates/eval", "crates/web-ui", "crates/ui", "crates/sandbox", "crates/sandbox-providers/macos-apple-container", "crates/sandbox-providers/macos-apple-vm", "crates/sandbox-providers/linux-podman"]
default-members = ["crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["JJy <jjyruby@gmail.com>"]
repository = "https://github.com/jjyr/pot"

[workspace.dependencies]
pot-resource = { path = "crates/resource" }
pot-sandbox-images = { path = "crates/sandbox-images" }
pot-sandbox = { path = "crates/sandbox" }
pot-sandbox-linux-podman = { path = "crates/sandbox-providers/linux-podman" }
pot-sandbox-macos-apple-container = { path = "crates/sandbox-providers/macos-apple-container" }
pot-sandbox-macos-apple-vm = { path = "crates/sandbox-providers/macos-apple-vm" }
pot-ui = { path = "crates/ui" }
pot-protocol = { path = "crates/protocol" }
pot-core = { path = "crates/core" }
pot-storage = { path = "crates/storage" }
pot-agent = { path = "crates/agent" }
pot-tool-executor = { path = "crates/tool-executor" }
pot-gateway = { path = "crates/gateway" }
pot-runtime = { path = "crates/runtime" }
pot-eval = { path = "crates/eval" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.dev]
debug = 0

[profile.release]
strip = true
