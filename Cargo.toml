[workspace]
resolver = "3"
members = ["resource", "sandbox-images", "app", "protocol", "core", "storage", "driver", "agent", "tool-executor", "gateway", "runtime", "server", "eval", "mobile", "ui", "sandbox", "sandbox-providers/linux", "sandbox-providers/macos"]
default-members = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["JJy <jjyruby@gmail.com>"]
repository = "https://github.com/jjyr/pot"

[workspace.dependencies]
pot-resource = { path = "resource" }
pot-sandbox-images = { path = "sandbox-images" }
pot-sandbox = { path = "sandbox" }
pot-sandbox-linux = { path = "sandbox-providers/linux" }
pot-sandbox-macos = { path = "sandbox-providers/macos" }
pot-ui = { path = "ui" }
pot-protocol = { path = "protocol" }
pot-core = { path = "core" }
pot-storage = { path = "storage" }
pot-driver = { path = "driver" }
pot-agent = { path = "agent" }
pot-tool-executor = { path = "tool-executor" }
pot-gateway = { path = "gateway" }
pot-runtime = { path = "runtime" }
pot-eval = { path = "eval" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = 0

[profile.release]
strip = true
