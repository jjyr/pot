[workspace]
resolver = "3"
members = ["app", "protocol", "core", "storage", "driver", "agent", "gateway", "runtime", "server", "eval"]
default-members = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
pot-protocol = { path = "protocol" }
pot-core = { path = "core" }
pot-storage = { path = "storage" }
pot-driver = { path = "driver" }
pot-agent = { path = "agent" }
pot-gateway = { path = "gateway" }
pot-runtime = { path = "runtime" }
pot-eval = { path = "eval" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = 0

[profile.release]
strip = true
