<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pot Sandbox</title>
<style>
:root{color-scheme:light;--bg:#fdfdfd;--surface:#fff;--panel:#f4f4f4;--ink:#262626;--muted:#646464;--line:#e8e8e8;--blue:#0068da;--error:#bd342d;--success:#247844;--attention:#885b13}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#202020;--surface:#2b2b2b;--panel:#282828;--ink:#f2f2f2;--muted:#b7b7b7;--line:#414141;--blue:#0a84ff;--error:#ff6961;--success:#78be8a;--attention:#d7af66}}
:root[data-theme=dark]{color-scheme:dark;--bg:#202020;--surface:#2b2b2b;--panel:#282828;--ink:#f2f2f2;--muted:#b7b7b7;--line:#414141;--blue:#0a84ff;--error:#ff6961;--success:#78be8a;--attention:#d7af66}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,sans-serif;height:100vh;display:flex;flex-direction:column}
header{height:56px;display:flex;align-items:center;gap:12px;padding:0 24px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}header strong{font-size:16px;font-weight:600}
button,select{font:13px -apple-system,BlinkMacSystemFont,sans-serif;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:6px;min-height:28px;padding:4px 10px;cursor:pointer;transition:background-color 140ms ease,border-color 140ms ease,box-shadow 140ms ease}
button:disabled{opacity:.45;cursor:default}button:not(:disabled):hover{background:var(--panel)}button:not(:disabled):active{box-shadow:inset 0 1px 3px #0001}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
#take{background:var(--blue);color:white;border-color:transparent}#take:not(:disabled):hover{filter:brightness(.94);background:var(--blue)}.spacer{flex:1}.status{color:var(--muted);font-size:12px}
main{flex:1;min-height:0;display:flex;background:var(--panel)}#screen{flex:1;min-width:0;overflow:hidden}aside{width:300px;max-width:42vw;flex-shrink:0;background:var(--surface);padding:24px;overflow:auto;border-left:1px solid var(--line);animation:surface-in 180ms ease-out}[hidden]{display:none!important}
aside h2{font-size:16px;font-weight:600;margin:0 0 24px}dt{font-size:12px;color:var(--muted);margin:20px 0 6px}dd{margin:0;line-height:1.6;overflow-wrap:anywhere;font-size:13px;font-variant-numeric:tabular-nums}footer{height:36px;display:flex;align-items:center;gap:16px;padding:0 24px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}footer select{font-size:12px;min-height:24px;padding:2px 6px}
.error{padding:10px 24px;background:color-mix(in srgb,var(--error) 7%,var(--bg));color:var(--error);font-size:13px;line-height:1.5}
#menu{position:absolute;right:20px;top:52px;padding:4px;background:var(--surface);border:1px solid var(--line);box-shadow:0 6px 24px #0002;border-radius:7px;z-index:5;animation:surface-in 160ms ease-out}#menu button{display:block;width:100%;text-align:left;border:0;background:transparent;margin:2px 0}#menu button:not(:disabled):hover{background:var(--panel)}body.native #menu{top:8px}
dialog{color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;width:420px;max-width:calc(100vw - 48px);box-shadow:0 12px 40px #0002}dialog[open]{animation:surface-in 200ms ease-out}dialog p{font-size:13px;color:var(--muted);line-height:1.5}dialog textarea{width:100%;height:140px;margin:12px 0;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:12px;font:13px -apple-system,BlinkMacSystemFont,sans-serif}dialog::backdrop{background:#0003}
#connection{display:inline-block;width:7px;height:7px;flex-shrink:0;border-radius:50%;background:var(--attention);cursor:help}#connection[data-state=connected]{background:var(--success)}#connection[data-state=disconnected],#connection[data-state=error]{background:var(--error)}#connection:focus-visible{outline:2px solid var(--blue);outline-offset:4px}
@keyframes surface-in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body>
<header><strong>Sandbox</strong><span id="connection" data-state="connecting" role="img" tabindex="0" title="连接中…" aria-label="连接中…"></span><span class="spacer"></span><button id="take">接管</button><button id="info" title="环境信息" aria-label="环境信息" aria-expanded="false">ⓘ</button><button id="more" title="更多操作" aria-label="更多操作" aria-expanded="false">···</button></header>
<div id="error" class="error" role="alert" hidden></div>
<div id="menu" hidden><button id="connect">重新连接桌面</button><button id="browser" disabled>打开浏览器</button><button id="clipboardOpen" disabled>剪贴板…</button><button id="workspace">打开工作目录</button><button id="manage">管理环境…</button><button id="stop">停止环境…</button><button id="restart">重启环境…</button></div>
<main><div id="screen"></div><aside id="details" hidden><h2>环境信息</h2><dl><dt>环境</dt><dd>本地 Linux VM · ARM64</dd><dt>状态</dt><dd id="environment">运行中</dd><dt>镜像</dt><dd id="image">正在读取…</dd><dt>Sandbox 镜像（压缩层大小）</dt><dd id="imageSize">正在读取…</dd><dt>运行时间</dt><dd id="uptime">—</dd><dt>CPU（所有 vCPU 的平均使用率）</dt><dd id="cpu">—</dd><dt>内存（使用 / VM 可用）</dt><dd id="memory">—</dd><dt>系统盘（使用 / 文件系统容量）</dt><dd id="disk">—</dd><dt>工作文件</dt><dd><span id="workspaceSize">正在读取…</span><br>独立持久保存，不计入系统盘。<br>按文件逻辑大小统计，每 30 秒更新。</dd></dl></aside></main>
<footer><span id="owner">正在查看</span><span class="spacer"></span><label>显示 <select id="scale"><option value="fit">适应窗口</option><option value="actual">原始大小</option></select></label></footer>
<dialog id="clipboardDialog"><strong>桌面剪贴板</strong><p>发送后，在远端应用中按 Ctrl+V 粘贴。</p><textarea id="clipboard" aria-label="剪贴板文本"></textarea><button id="paste">发送到桌面</button> <button id="closeClipboard">关闭</button></dialog>
<script type="module">
import RFB from '/novnc/core/rfb.js';
const token=location.hash.slice(1),$=id=>document.getElementById(id);let rfb,state,controlDown=false,connected=false,connecting=true,refreshing=false;
function publish(){window.webkit?.messageHandlers.potDesktop.postMessage({action:'viewer-state',connected,connecting,human:state?.owner==='human',info:!$('details').hidden})}
if(new URLSearchParams(location.search).has('native')){document.body.classList.add('native');document.querySelector('header').hidden=true;}
function connection(kind,label){const dot=$('connection');dot.dataset.state=kind;dot.title=label;dot.setAttribute('aria-label',label);publish()}
function error(message=''){$('error').hidden=!message;$('error').textContent=message}
async function api(path,body){const res=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{'X-Pot-Token':token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(!res.ok)throw Error((await res.text()).slice(0,300));return res.json()}
// Normalize native accessibility mouse metadata for the noVNC canvas.
document.addEventListener('mousedown',e=>{if(e.target.tagName==='CANVAS'&&e.buttons===0)Object.defineProperty(e,'buttons',{value:[1,4,2][e.button]||0})},true);
for(const type of ['keydown','keyup'])document.addEventListener(type,e=>{if(e.target.tagName==='CANVAS'&&rfb&&state?.owner==='human'&&controlDown!==e.ctrlKey){controlDown=e.ctrlKey;rfb.sendKey(0xffe3,'ControlLeft',controlDown)}},true);
async function refresh(){if(refreshing)return;refreshing=true;try{const epoch=state?.epoch;state=await api('status');if(epoch!==state.epoch)controlDown=false;const human=state.owner==='human';if(rfb)rfb.viewOnly=!human;$('take').textContent=human?'交还控制':'接管';$('owner').textContent=human?'你正在控制':state.owner==='agent'?'正在查看 · 控制权已交还':'正在查看 · 尚未接管';for(const id of ['browser','clipboardOpen','paste'])$(id).disabled=!human;connection(connected?'connected':connecting?'connecting':'disconnected',connected?'已连接':connecting?'连接中…':'桌面已断开');}catch(e){connection('error','连接中断');error('无法连接桌面服务，请重连或检查环境状态。')}finally{refreshing=false}}
function connect(){controlDown=false;connected=false;connecting=true;connection('connecting','连接中…');if(rfb)rfb.disconnect();$('screen').replaceChildren();const current=new RFB($('screen'),`ws://${location.host}/rfb?token=${encodeURIComponent(token)}`);rfb=current;rfb.scaleViewport=$('scale').value==='fit';rfb.viewOnly=true;rfb.addEventListener('connect',()=>{if(rfb!==current)return;connected=true;connecting=false;connection('connected','已连接');error();refresh()});rfb.addEventListener('disconnect',()=>{if(rfb!==current)return;connected=false;connecting=false;connection('disconnected','桌面已断开');refresh()});rfb.addEventListener('clipboard',e=>$('clipboard').value=e.detail.text)}
$('take').onclick=async()=>{const action=state?.owner==='human'?'return':'take';$('take').disabled=true;try{if(action==='return'&&rfb)rfb.viewOnly=true;await api('control',{action});error();await refresh()}catch(e){error('控制权切换失败：'+e.message);await refresh()}finally{$('take').disabled=false}};
$('connect').onclick=()=>{connect();$('menu').hidden=true};
$('browser').onclick=async()=>{try{await api('browser',{});error();$('menu').hidden=true}catch(e){error(e.message)}};
$('more').onclick=()=>{$('menu').hidden=!$('menu').hidden;$('more').setAttribute('aria-expanded',!$('menu').hidden)};
$('info').onclick=()=>{$('details').hidden=!$('details').hidden;$('info').setAttribute('aria-expanded',!$('details').hidden);if(!$('details').hidden)metrics();publish()};
$('scale').onchange=()=>{if(rfb)rfb.scaleViewport=$('scale').value==='fit'};
$('clipboardOpen').onclick=()=>{$('menu').hidden=true;$('clipboardDialog').showModal()};$('closeClipboard').onclick=()=>$('clipboardDialog').close();$('paste').onclick=()=>{if(state?.owner==='human'){rfb?.clipboardPasteFrom($('clipboard').value);$('clipboardDialog').close()}};
for(const id of ['workspace','manage','stop','restart'])$(id).onclick=()=>{window.webkit?.messageHandlers.potDesktop.postMessage({action:id});$('menu').hidden=true};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('menu').hidden=true});
const gib=n=>(n/1024**3).toFixed(2)+' GiB';
async function metrics(){try{const m=await api('metrics');$('image').textContent=m.image||'暂不可用';$('imageSize').textContent=m.image_bytes==null?'暂不可用':(m.image_bytes/1024**2).toFixed(1)+' MiB';$('cpu').textContent=(m.cpu_percent==null?'正在采样':m.cpu_percent+'%')+' / '+m.cpus+' vCPU';$('memory').textContent=gib(m.memory_used)+' / '+gib(m.memory_total)+'（配置 '+m.memory_gib+' GiB）';$('disk').textContent=gib(m.disk_used)+' / '+gib(m.disk_total);$('workspaceSize').textContent=m.workspace_bytes==null?'暂不可用':(m.workspace_bytes/1024**2).toFixed(2)+' MiB';$('uptime').textContent=Math.floor(m.uptime_seconds/60)+' 分钟';}catch(e){$('environment').textContent='指标暂不可用'}}
setInterval(refresh,1500);setInterval(()=>{if(!$('details').hidden)metrics();publish()},2500);connect();
</script></body></html>
