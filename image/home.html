 sending, press Ctrl+V in the remote application to paste.","web.send-to-desktop":"Send to desktop","web.close":"Close","web.more-actions":"More actions","web.clipboard-text":"Clipboard text","web.pot-work-desktop":"Pot · Work desktop","web.your-work-desktop":"Your work desktop","web.this-is-where-pot-works":"This is where Pot works.","web.watch-its-progress-or-take-over-the":"Watch its progress or take over the mouse and keyboard.","web.open-a-website-using-the-address-bar":"Open a website using the address bar. When finished, click “Give back control”.","web.closing-the-browser-keeps-the-desktop-and":"Closing the browser keeps the desktop and chat running.","web.configured-memory":" (configured: {memory} GiB)","web.uptime.one":"{count} minute","web.uptime.other":"{count} minutes","web.take-over-first":"Take over the desktop first"},"zh-CN":{"web.give-back-control":"交还控制","web.take-over":"接管","web.you-are-in-control":"你正在控制","web.viewing-control-returned":"正在查看 · 控制权已交还","web.viewing-not-taken-over":"正在查看 · 尚未接管","web.connected":"已连接","web.connecting":"连接中…","web.desktop-disconnected":"桌面已断开","web.connection-interrupted":"连接中断","web.cannot-connect-to-the-desktop-service-reconnect":"无法连接桌面服务，请重连或检查环境状态。","web.unable-to-switch-control":"控制权切换失败：","web.unavailable":"暂不可用","web.sampling":"正在采样","web.metrics-unavailable":"指标暂不可用","web.reconnect-desktop":"重新连接桌面","web.open-browser":"打开浏览器","web.clipboard":"剪贴板…","web.open-workspace":"打开工作目录","web.manage-environment":"管理环境…","web.stop-environment":"停止环境…","web.restart-environment":"重启环境…","web.environment-information":"环境信息","web.environment":"环境","web.local-linux-vm-arm64":"本地 Linux VM · ARM64","web.status":"状态","web.running":"运行中","web.image":"镜像","web.loading":"正在读取…","web.sandbox-image-compressed-layers":"Sandbox 镜像（压缩层大小）","web.uptime":"运行时间","web.cpu-average-across-all-vcpus":"CPU（所有 vCPU 的平均使用率）","web.memory-used-vm-available":"内存（使用 / VM 可用）","web.system-disk-used-filesystem-capacity":"系统盘（使用 / 文件系统容量）","web.work- window.potLocale = 'en';
window.potT = key => potTranslations[window.potLocale]?.[key] ?? potTranslations.en[key] ?? key;
window.potF = (key, args) => potT(key).replace(/\{(\w+)\}/g, (match, name) => args[name] ?? match);
window.potNumber = (number, digits = 0) => new Intl.NumberFormat(window.potLocale, {minimumFractionDigits: digits, maximumFractionDigits: digits}).format(number);
window.potSetLocale = language => {
    const locale = language === 'zh-CN' ? 'zh-CN' : 'en';
    window.potLocale = locale;
    document.documentElement.lang = locale;
    try { localStorage.setItem('pot-language', locale); } catch {}
    document.querySelectorAll('[data-pot-i18n]').forEach(el => el.textContent = potT(el.dataset.potI18n));
    for (const attribute of ['title', 'aria-label']) {
        document.querySelectorAll('[data-pot-' + attribute + ']').forEach(el => el.setAttribute(attribute, potT(el.getAttribute('data-pot-' + attribute))));
    }
    window.dispatchEvent(new Event('pot-locale'));
};
const potInitialLocale = () => {
    try { const saved = localStorage.getItem('pot-language'); if (['en', 'zh-CN'].includes(saved)) return saved; } catch {}
    for (const language of navigator.languages ?? []) {
        const base = language.replaceAll('_', '-').toLowerCase().split('-')[0];
        if (base === 'zh') return 'zh-CN';
        if (base === 'en') return 'en';
    }
    return 'en';
};
document.addEventListener('DOMContentLoaded', () => potSetLocale(potInitialLocale()));
</script>

<script>
async function potReadLocale() {
    try { const response = await fetch('http://127.0.0.1:17681/api/locale');
        if (!response.ok) return;
        const {locale} = await response.json();
        if (['en', 'zh-CN'].includes(locale) && locale !== window.potLocale) window.potSetLocale(locale);
    } catch {}
}
document.addEventListener('DOMContentLoaded', potReadLocale);
setInterval(potReadLocale, 2500);
</script>
