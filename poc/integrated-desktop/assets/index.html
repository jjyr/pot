<!doctype html><meta charset="utf-8"><title>pot integrated desktop</title>
<style>body{margin:0;background:#172027;color:#eef5f5;font:14px system-ui}header{padding:12px}button,input,textarea{font:inherit;padding:8px}#screen{height:65vh}#status{white-space:pre-wrap}textarea{width:65%;height:45px}</style>
<header><b>pot / desktop</b> <button id="connect">Connect / reconnect</button> <button id="take">Take over</button> <button id="return">Return control</button><div id="status">disconnected</div><input id="driverText" value="Agent test 中文"><button id="driver">Driver write</button><br><textarea id="clipboard" placeholder="中文剪贴板：接管后输入，再点 Send clipboard，远端 Ctrl+V"></textarea><button id="paste">Send clipboard</button><div id="error"></div></header><div id="screen"></div>
<script type="module">
import RFB from '/novnc/core/rfb.js';
for(const type of ['mousedown','mouseup','keydown','keyup'])document.addEventListener(type,e=>window.webkit?.messageHandlers.poc.postMessage({type,button:e.button,buttons:e.buttons,key:e.key,ctrl:e.ctrlKey,target:e.target.tagName}),true);
const token=location.hash.slice(1);let rfb,state;
const $=id=>document.getElementById(id);
// WKWebView/native accessibility events can omit buttons and modifier transitions.
// Normalize contradictory native event metadata; never synthesize text or clicks.
let controlDown=false;
document.addEventListener('mousedown',e=>{if(e.target.tagName==='CANVAS' && e.buttons===0)Object.defineProperty(e,'buttons',{value:[1,4,2][e.button]||0})},true);
for(const type of ['keydown','keyup'])document.addEventListener(type,e=>{if(e.target.tagName==='CANVAS' && rfb && state?.owner==='human' && controlDown!==e.ctrlKey){controlDown=e.ctrlKey;rfb.sendKey(0xffe3,'ControlLeft',controlDown)}},true);
async function api(path,body){let res=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{'X-Pot-Token':token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(!res.ok)throw Error(await res.text());return res.json()}
async function refresh(){const epoch=state?.epoch;state=await api('status');if(epoch!==state.epoch)controlDown=false;$('status').textContent=`${state.environment} | ${state.phase} | owner: ${state.owner} | epoch: ${state.epoch}`;if(rfb && rfb.viewOnly!==(state.owner!=='human'))rfb.viewOnly=state.owner!=='human';$('paste').disabled=state.owner!=='human';}
function connect(){controlDown=false;if(rfb)rfb.disconnect();rfb=new RFB($('screen'),`ws://${location.host}/rfb?token=${encodeURIComponent(token)}`);rfb.scaleViewport=true;rfb.viewOnly=true;rfb.addEventListener('connect',refresh);rfb.addEventListener('disconnect',refresh);rfb.addEventListener('clipboard',e=>$('clipboard').value=e.detail.text)}
for(let action of ['take','return'])$(action).onclick=async()=>{controlDown=false;if(action==='return'&&rfb)rfb.viewOnly=true;try{await api('control',{action});await refresh()}catch(e){$('error').textContent=e.message}};
$('driver').onclick=async()=>{try{await api('driver',{text:$('driverText').value});$('error').textContent='Driver write completed'}catch(e){$('error').textContent=e.message}};
$('paste').onclick=()=>rfb?.clipboardPasteFrom($('clipboard').value);$('connect').onclick=connect;
setInterval(()=>refresh().catch(e=>$('error').textContent=e.message),750);connect();
</script>
