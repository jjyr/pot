[package]
name = "pot-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
presentation = ["dep:gpui-kit", "dep:uuid", "dep:web-time", "dep:image"]

[dependencies]
pot-avatar.workspace = true
image = { version = "0.25.10", default-features = false, optional = true }
gpui-kit = { workspace = true, optional = true }
pot-protocol.workspace = true
pot-core.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
unicode-segmentation = "1.12"
uuid = { version = "1", features = ["v4", "js"], optional = true }

web-time = {version="1",optional=true}

[build-dependencies]
serde_json.workspace = true
