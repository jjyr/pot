[package]
name = "pot-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
pot-protocol.workspace = true
pot-core.workspace = true
pot-storage.workspace = true
pot-driver.workspace = true
pot-agent.workspace = true
pot-gateway.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
futures = "0.3"
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
async-stream = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream", "rustls"] }

libc = "0.2"

chrono = "0.4"
chrono-tz = "0.10"

sha2 = "0.11"

[dev-dependencies]
pot-tool-executor.workspace = true
tokio-tungstenite = "0.30"
