/* Machine membership shares the editor lifecycle; connection credentials never
   enter this visual surface. The execution link uses a dashed device relation. */
.editor-form.machine-connection-editor{max-width:600px;padding-top:12px;min-width:0}
.machine-connection-editor .editor-fields{min-width:0;flex:initial}
.machine-connection-intro{margin:8px 0 28px}
.machine-connection-intro h2{font-size:24px;font-weight:600;line-height:1.3;margin:0 0 9px;letter-spacing:-.35px}
.machine-connection-intro p{margin:0;line-height:1.6}
.machine-connection-editor .form-row{padding:0;min-width:0}
.machine-connection-editor .machine-control-selection{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 0;margin:0 0 18px;border-bottom:1px solid var(--divider)}
.machine-control-selection .form-label{color:var(--muted);font-weight:400;flex:1}
.machine-control-selection .field-body{flex:initial;min-width:0;max-width:70%}
.machine-control-selection .field-input{min-height:34px;max-width:100%;width:190px;font-size:14px}
.machine-invitation-panel{border:1px solid var(--divider);border-radius:14px;background:color-mix(in srgb,var(--surface) 65%,var(--navigation));padding:28px 22px 22px;text-align:center}
.machine-connection-pair{display:flex;align-items:flex-start;justify-content:center;gap:12px;margin:0 auto 25px;max-width:360px}
.machine-connection-node{width:112px;min-width:0;display:flex;align-items:center;flex-direction:column;gap:10px}
.machine-connection-node&gt;span:last-child{font-size:13px;line-height:1.4;max-width:100%;overflow-wrap:anywhere;color:var(--muted)}
.machine-connection-brand{display:block;width:54px;height:54px;object-fit:contain;flex:none}
.machine-connection-device{display:grid;place-items:center;width:54px;height:54px;color:var(--muted)}
.machine-connection-device&gt;svg{width:39px;height:39px;stroke-width:1.25}
.machine-connection-wire{display:block;flex:1;height:1px;max-width:100px;min-width:28px;margin-top:27px;background:repeating-linear-gradient(90deg,var(--input-border) 0,var(--input-border) 4px,transparent 4px,transparent 8px)}
.machine-connection-wire.ready{background:repeating-linear-gradient(90deg,var(--success) 0,var(--success) 4px,transparent 4px,transparent 8px)}
.machine-invitation-panel h3{font-size:15px;font-weight:500;line-height:1.5;margin:0 0 7px}
.machine-invitation-panel&gt;p.hint{font-size:13px;margin:0;line-height:1.6}
.machine-invitation-panel&gt;.control{display:inline-flex;justify-content:center;align-items:center;gap:8px;min-height:38px;margin:20px 0 12px;padding:8px 18px}
.machine-invitation-panel&gt;.control&gt;svg{width:16px;height:16px}
.machine-invitation-panel&gt;.machine-invitation-expiry{font-size:12px}
.machine-connection-status{display:flex;align-items:flex-start;gap:11px;padding:18px 0 10px}
.machine-connection-status strong{font-size:14px;font-weight:500;line-height:1.5}
.machine-connection-status p{margin:4px 0 0;font-size:13px;line-height:1.6}
.machine-wait-dot{display:block;flex:none;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-top:7px;animation:machine-wait 2s ease-in-out infinite}
.machine-wait-dot.online{background:var(--success);animation:none}
.machine-connection-status.registered .machine-wait-dot{animation:none}
.machine-invitation-availability:empty{display:none}
.machine-invitation-availability{font-size:13px;line-height:1.6;margin:14px 0 0}
.machine-invitation-availability&gt;.control{margin-left:10px}
.machine-connection-help{margin:20px 0 0;border-top:1px solid var(--divider)}
.machine-connection-editor .detail-disclosure{margin:0;border-bottom:1px solid var(--divider);padding:13px 0;font-size:13px}
.machine-connection-editor .detail-disclosure&gt;summary{cursor:pointer;color:var(--muted);font-weight:400;line-height:1.5}
.machine-connection-help .detail-disclosure p{margin:12px 0;font-size:13px;line-height:1.6}
.machine-connection-help a{font-size:13px;color:var(--primary)}
.machine-connection-values{display:grid;grid-template-columns:112px minmax(0,1fr);gap:10px 14px;padding:5px 0 0;font-size:12px;line-height:1.6;min-width:0}
.machine-connection-values dt{color:var(--muted)}
.machine-connection-values dd{margin:0;overflow-wrap:anywhere;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px}
.machine-connection-editor .editor-actions{position:static;align-items:center;margin-top:26px;padding:18px 0;border:0;background:transparent;gap:10px}
.machine-connection-editor .editor-actions&gt;.control{min-height:36px;padding:7px 15px}
.machine-connection-editor .editor-actions&gt;.machine-revoke{margin-right:auto;background:transparent;border-color:transparent;padding-left:0;font-size:13px}
.machine-connection-editor .editor-actions .control[hidden],.machine-connection-editor [hidden]{display:none!important}
.machine-connection-editor .machine-join-input{display:flex;flex-direction:column;align-items:stretch;gap:9px}
.machine-connection-editor .machine-join-input&gt;.form-label{font-size:13px;font-weight:500}
.machine-connection-editor .machine-join-input .field-body{display:flex;flex-direction:row;align-items:stretch;gap:8px;width:100%;min-width:0}
.machine-connection-editor .machine-join-input .field-input{flex:1;width:0;min-width:0;height:42px;padding:10px 12px;font-size:13px}
.machine-connection-editor .machine-join-input .control{display:flex;align-items:center;justify-content:center;gap:7px;padding:8px 12px;min-height:42px;font-size:13px}
.machine-connection-editor .machine-join-input .control svg{width:15px;height:15px}
.machine-connection-editor .machine-join-input-hint{font-size:12px;line-height:1.6;margin:10px 0 20px}
.machine-join-status{display:flex;align-items:center;gap:8px;font-size:13px;line-height:1.6;margin:12px 0 20px;min-width:0}
.machine-join-status&gt;svg{width:16px;height:16px;flex:none}
.machine-join-status .machine-wait-dot{margin-top:0}
.machine-join-status .control{font-size:12px;margin-left:auto;flex:none}
.machine-verified-identity{display:flex;align-items:center;gap:13px;padding:16px;border:1px solid var(--divider);border-radius:12px;margin:24px 0 18px;min-width:0}
.machine-verified-identity .machine-connection-brand{width:38px;height:38px}
.machine-identity-body{flex:1;min-width:0;overflow-wrap:anywhere}

/* The approved line-pot concept, kept inside a fixed 24px name-line slot. */
.assistant-activity{position:relative;display:inline-block;width:24px;height:24px;flex:none;color:var(--text);}
.activity-pot{position:absolute;left:0;top:0;width:48px;height:48px;transform:scale(.5);transform-origin:0 0;}
.activity-pot-rig{position:absolute;inset:0;transform-origin:50% 85%;}
.activity-pot-body{position:absolute;left:10px;top:25px;width:29px;height:17px;border:2px solid currentColor;border-radius:2px 2px 11px 11px;background:var(--assistant-pane);z-index:2;}
.activity-pot-handle{position:absolute;top:26px;width:7px;height:6px;border:2px solid currentColor;border-radius:3px;}
.activity-pot-handle.handle-left{left:5px;}.activity-pot-handle.handle-right{right:4px;}
.activity-pot-lid{position:absolute;left:8px;top:21px;width:33px;height:5px;border:2px solid currentColor;border-radius:9px 9px 3px 3px;background:var(--assistant-pane);transform-origin:50% 70%;z-index:3;}
.activity-pot-lid::before{content:&#x27;&#x27;;position:absolute;left:10px;top:-7px;width:8px;height:5px;border:2px solid currentColor;border-radius:4px 4px 0 0;background:var(--assistant-pane);}
.assistant-row.is-selected :is(.activity-pot-body,.activity-pot-lid,.activity-pot-lid::before){background:var(--assistant-selection);}
.assistant-row:hover:not(.is-selected) :is(.activity-pot-body,.activity-pot-lid,.activity-pot-lid::before){background:var(--button-hover);}
.activity-pot-steam{position:absolute;left:14px;top:10px;width:5px;height:9px;border-left:2px solid currentColor;border-radius:50%;opacity:0;}
.activity-pot-steam.steam-two{left:24px;top:7px;animation-delay:-.5s;}.activity-pot-steam.steam-three{left:33px;top:11px;animation-delay:-1s;}
.activity-pot-check{display:none;position:absolute;right:1px;top:12px;width:13px;height:13px;border-radius:50%;background:var(--success);z-index:4;}
.activity-pot-check::after{content:&#x27;&#x27;;position:absolute;left:3px;top:3px;width:7px;height:4px;border-left:1.7px solid var(--canvas);border-bottom:1.7px solid var(--canvas);transform:rotate(-45deg);}
.assistant-activity[data-state=cooking] .activity-pot-rig{animation:pot-boil 1.5s ease-in-out infinite;}
.assistant-activity[data-state=cooking] .activity-pot-lid{animation:pot-lid-rattle .36s ease-in-out infinite;}
.assistant-activity[data-state=cooking] .activity-pot-steam{animation-name:pot-steam;animation-duration:1.45s;animation-timing-function:ease-out;animation-iteration-count:infinite;}
.assistant-activity[data-state=ready] .activity-pot-lid{transform:translate(-1px,-2px) rotate(-9deg);}
.assistant-activity[data-state=ready] .activity-pot-check{display:block;}
.assistant-activity[data-state=ready] .steam-two{animation-name:pot-rest;animation-duration:3.6s;animation-timing-function:ease-out;animation-iteration-count:infinite;}
.pot-app.is-background .assistant-activity *{animation-play-state:paused;}
@keyframes pot-boil{0%,100%{transform:translate(0,0) rotate(0)}15%{transform:translate(-1px,0) rotate(-5deg)}30%{transform:translate(1px,-1px) rotate(4deg)}45%{transform:translate(-1px,0) rotate(-4deg)}60%{transform:translate(1px,-1px) rotate(3deg)}80%{transform:translate(0,0)}}
@keyframes pot-lid-rattle{0%,100%{transform:translateY(0) rotate(-3deg)}32%{transform:translate(0,-3px) rotate(5deg)}64%{transform:translate(-1px,-1px) rotate(-6deg)}}
@keyframes pot-steam{0%{opacity:0;transform:translate(0,3px) scale(.7)}22%{opacity:.75}75%{opacity:.4}100%{opacity:0;transform:translate(3px,-9px) scale(1.1)}}
@keyframes pot-rest{0%,100%{opacity:0;transform:translateY(1px)}30%{opacity:.45}80%{opacity:0;transform:translate(2px,-8px)}}
@media(prefers-reduced-motion:reduce){.assistant-activity *{animation:none!important;}.assistant-activity[data-state=cooking] .activity-pot-lid{transform:translateY(-3px) rotate(-6deg);}.assistant-activity[data-state=cooking] .activity-pot-steam{opacity:.65;}.assistant-activity[data-state=ready] .steam-two{opacity:.3;}}






/* Shared semantic values and geometry preserve the established Pot design.
   System appearance follows the OS live, without recreating the text editor. */

:host {
  color-scheme: light;
  --canvas: #fdfdfd; --surface: #fff; --navigation: #f4f4f4;
  --assistant-pane: #e9eef5; --assistant-selection: #d9e4f3;
  --text: #262626; --muted: #646464; --divider: #e8e8e8; --input-border: #d6d6d6;
  --primary: #0068da; --primary-hover: #005ec6; --primary-active: #0054b0;
  --secondary: #eceff3; --secondary-hover: #e4e8ed; --secondary-active: #dce1e8;
  --button-hover: #ebeff5; --button-active: #dde5ef; --selection: #dcecff;
  --user-fill: #e7f2ff; --user-text: #25435f;
  --success: #247844; --attention: #885b13; --danger: #bd342d;
  --rail-width: 56px; --assistant-width: 236px; --titlebar-height: 44px;
  --page-inset: 32px; --body-size: 14px; --description-size: 13px; --control-height: 28px;
  --radius: 6px; --composer-radius: 16px; --conversation-width: 760px; --page-width: 820px;
  --motion-fast: 110ms; --motion-normal: 180ms; --motion-page: 240ms; --ease-out: cubic-bezier(.2,.8,.2,1);
  --safe-area-top: 0px; --safe-area-right: 0px; --safe-area-bottom: 0px; --safe-area-left: 0px;
  --viewport-height: 100dvh; --viewport-width: 100%; --viewport-top: 0px; --viewport-left: 0px;
  font-family: -apple-system, -apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, sans-serif;
  font-size: var(--body-size); line-height: 1.5;
}
